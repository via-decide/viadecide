<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaDecide Launcher | Explorer Pass</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #151515;
            --border: #333;
            --primary: #ff2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .launcher-container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255, 42, 42, 0.1);
            color: var(--primary);
            border: 1px solid rgba(255, 42, 42, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out backwards;
            cursor: pointer;
        }

        .app-card:nth-child(1) { animation-delay: 0.1s; }
        .app-card:nth-child(2) { animation-delay: 0.2s; }
        .app-card:nth-child(3) { animation-delay: 0.3s; }
        .app-card:nth-child(4) { animation-delay: 0.4s; }
        .app-card:nth-child(5) { animation-delay: 0.5s; }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border);
            transition: background 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .app-card:hover::before {
            background: var(--primary);
        }

        .app-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .app-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .app-action {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .app-card:hover .app-action {
            color: var(--primary);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="launcher-container">
        <div class="header">
            <div class="badge" id="status-badge">Activating Pass...</div>
            <h1>Ecosystem Launcher</h1>
            <p>Your SmartTag has unlocked the ViaDecide Learning Engine.</p>
        </div>

        <div class="app-grid" id="app-grid">
            <!-- Cards rendered by JS with auth token appended to URLs -->
        </div>
    </div>

    <script>
        // ============================================================
        // EXPLORER PASS — Cross-Origin Auth Bridge
        // 
        // localStorage is origin-scoped. Since each app may live on
        // a different domain (daxini.xyz, viadecide.com, etc.), we
        // cannot rely on shared localStorage.
        //
        // Strategy:
        //   1. Store flag in localStorage for same-origin apps.
        //   2. Append `?via_source=smarttag-qr` to ALL app URLs.
        //   Each app reads this query param on load and sets its own
        //   internal flag, then strips the param from the URL.
        // ============================================================

        const APPS = [
            {
                icon: '📚',
                title: 'StudyOS',
                desc: 'The Knowledge Engine. Consume dynamic syllabus modules, parse PDFs, and manage daily missions.',
                url: '/StudyOS/index.html',
                unlockDays: 0
            },
            {
                icon: '🎯',
                title: 'PrepOS',
                desc: 'The Assessment Engine. Take timed mock exams and analyze weak areas through challenge loops.',
                url: 'https://viadecide.com/prepos/index.html',
                unlockDays: 7
            },
            {
                icon: '🛠️',
                title: 'SkillHex',
                desc: "The Builder's Portfolio. Apply your knowledge by building and verifying real-world projects.",
                url: 'https://viadecide.com/decide.engine-tools/games/skillhex/index.html',
                unlockDays: 14
            },
            {
                icon: '✨',
                title: 'Alchemist',
                desc: 'The Synthesis Engine. Generate personalized study guides, revision materials, and e-books.',
                url: 'https://daxini.xyz/alchemist/',
                unlockDays: 21
            },
            {
                icon: '🧬',
                title: 'Lore Labs',
                desc: 'The Visualization Engine. Dive into 3D interactive modules like the Organic Synthesis Matrix.',
                url: 'https://viadecide.com/Dharam-Daxini/dist/index.html',
                unlockDays: 28
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const badge = document.getElementById('status-badge');
            const grid = document.getElementById('app-grid');

            // 1. Set/Get localStorage for same-origin apps and track unlock date
            let unlockedAtStr = localStorage.getItem('via_unlocked_at');
            if (!unlockedAtStr) {
                unlockedAtStr = new Date().toISOString();
                try {
                    localStorage.setItem('via_explorer_pass', 'active');
                    localStorage.setItem('via_auth_source', 'smarttag-qr');
                    localStorage.setItem('via_unlocked_at', unlockedAtStr);
                } catch (err) {
                    console.warn('localStorage unavailable:', err);
                }
            }

            // Calculate active days
            const unlockedAtDate = new Date(unlockedAtStr);
            const now = new Date();
            // Force 0 days if something went wrong, else calculate days diff
            let activeDays = Math.floor((now - unlockedAtDate) / (1000 * 60 * 60 * 24));
            if (activeDays < 0 || isNaN(activeDays)) activeDays = 0;

            // 2. Update badge
            badge.textContent = `Explorer Pass Active • Day ${activeDays + 1}`;
            badge.style.background = 'rgba(0, 255, 136, 0.1)';
            badge.style.color = '#00ff88';
            badge.style.borderColor = 'rgba(0, 255, 136, 0.3)';

            // 3. Render cards — progressive disclosure architecture
            APPS.forEach((app, i) => {
                const isLocked = activeDays < app.unlockDays;
                
                const card = document.createElement('div');
                card.className = 'app-card';
                card.style.animationDelay = `${(i + 1) * 0.1}s`;

                if (isLocked) {
                    // Locked State UI
                    card.style.opacity = '0.5';
                    card.style.cursor = 'not-allowed';
                    card.style.filter = 'grayscale(100%)';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div class="app-icon" style="filter: brightness(0.5);">${app.icon}</div>
                            <div style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: #888;">
                                🔒 Locked
                            </div>
                        </div>
                        <div class="app-title">${app.title}</div>
                        <div class="app-desc">${app.desc}</div>
                        <div class="app-action" style="color: #666;">
                            Unlocks after ${app.unlockDays} days of use
                        </div>
                    `;
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert(`${app.title} unlocks after ${app.unlockDays} days of active usage. Keep learning!`);
                    });
                } else {
                    // Unlocked State UI
                    const authUrl = new URL(app.url);
                    authUrl.searchParams.set('via_source', 'smarttag-qr');

                    card.innerHTML = `
                        <div class="app-icon">${app.icon}</div>
                        <div class="app-title">${app.title}</div>
                        <div class="app-desc">${app.desc}</div>
                        <div class="app-action">Launch App &rarr;</div>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = authUrl.toString();
                    });
                }
                
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
