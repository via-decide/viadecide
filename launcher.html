<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaDecide Launcher | Explorer Pass</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #151515;
            --border: #333;
            --primary: #ff2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .launcher-container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255, 42, 42, 0.1);
            color: var(--primary);
            border: 1px solid rgba(255, 42, 42, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out backwards;
            cursor: pointer;
        }

        .app-card:nth-child(1) { animation-delay: 0.1s; }
        .app-card:nth-child(2) { animation-delay: 0.2s; }
        .app-card:nth-child(3) { animation-delay: 0.3s; }
        .app-card:nth-child(4) { animation-delay: 0.4s; }
        .app-card:nth-child(5) { animation-delay: 0.5s; }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border);
            transition: background 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .app-card:hover::before {
            background: var(--primary);
        }

        .app-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .app-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .app-action {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .app-card:hover .app-action {
            color: var(--primary);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="launcher-container">
        <div class="header">
            <div class="badge" id="status-badge">Activating Pass...</div>
            <h1>Ecosystem Launcher</h1>
            <p>Your SmartTag has unlocked the ViaDecide Learning Engine.</p>
        </div>

        <div class="app-grid" id="app-grid">
            <!-- Cards rendered by JS with auth token appended to URLs -->
        </div>
    </div>

    <script>
        // ============================================================
        // EXPLORER PASS — Aporaksha Auth Depth Entitlements Engine
        // 
        // Gates 5 apps based on Auth Depth (1-5 scale)
        // ============================================================

        const APPS = [
            {
                id: 'study-os',
                icon: '📚',
                title: 'Study-OS',
                desc: 'The Knowledge Engine. Consume dynamic syllabus modules, parse PDFs, and manage daily missions.',
                url: '/StudyOS/index.html',
                reqDepth: 1
            },
            {
                id: 'prep-os',
                icon: '🎯',
                title: 'Prep-OS',
                desc: 'The Assessment Engine. Take timed mock exams and analyze weak areas through challenge loops.',
                url: 'https://viadecide.com/prepos/index.html',
                reqDepth: 2
            },
            {
                id: 'alchemist',
                icon: '✨',
                title: 'Alchemist',
                desc: 'The Synthesis Engine. Generate personalized study guides, revision materials, and e-books.',
                url: 'https://daxini.xyz/alchemist/',
                reqDepth: 3
            },
            {
                id: 'logichub',
                icon: '🛠️',
                title: 'LogicHub',
                desc: 'Advanced project building environment and execution sandbox.',
                url: 'https://logichub.viadecide.com',
                reqDepth: 4
            },
            {
                id: 'daxini',
                icon: '🧠',
                title: 'Daxini Node',
                desc: 'Full sovereign execution authority and multi-agent orchestration.',
                url: 'https://daxini.xyz',
                reqDepth: 5
            }
        ];

        const TIER_NAMES = {
            1: 'Registered',
            2: 'Explorer',
            3: 'Builder',
            4: 'Architect',
            5: 'Power User'
        };

        let authDepth = parseInt(localStorage.getItem('aporaksha_auth_depth') || '1', 10);
        if (isNaN(authDepth) || authDepth < 1 || authDepth > 5) authDepth = 1;

        function renderLauncher() {
            const badge = document.getElementById('status-badge');
            const grid = document.getElementById('app-grid');
            
            // Clear existing grid
            grid.innerHTML = '';

            // Update badge
            badge.textContent = `Aporaksha Level ${authDepth} • ${TIER_NAMES[authDepth]}`;
            badge.style.background = authDepth >= 5 ? 'rgba(255, 42, 42, 0.15)' : 'rgba(0, 255, 136, 0.1)';
            badge.style.color = authDepth >= 5 ? '#ff2a2a' : '#00ff88';
            badge.style.borderColor = authDepth >= 5 ? 'rgba(255, 42, 42, 0.3)' : 'rgba(0, 255, 136, 0.3)';

            // Render cards — progressive disclosure architecture
            APPS.forEach((app, i) => {
                const isLocked = authDepth < app.reqDepth;
                
                const card = document.createElement('div');
                card.className = 'app-card';
                card.style.animationDelay = `${(i + 1) * 0.1}s`;

                if (isLocked) {
                    // Locked State UI
                    card.style.opacity = '0.5';
                    card.style.cursor = 'not-allowed';
                    card.style.filter = 'grayscale(100%)';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div class="app-icon" style="filter: brightness(0.5);">${app.icon}</div>
                            <div style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: #888;">
                                🔒 Locked
                            </div>
                        </div>
                        <div class="app-title">${app.title}</div>
                        <div class="app-desc">${app.desc}</div>
                        <div class="app-action" style="color: #666; font-size: 0.8rem;">
                            Upgrade to Level ${app.reqDepth} (${TIER_NAMES[app.reqDepth]}) to unlock.
                        </div>
                    `;
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert(`${app.title} requires Aporaksha Auth Depth ${app.reqDepth} (${TIER_NAMES[app.reqDepth]}). Your current depth is ${authDepth}.`);
                    });
                } else {
                    // Unlocked State UI
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div class="app-icon">${app.icon}</div>
                            <div style="background: rgba(0,255,136,0.1); color: #00ff88; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">
                                🔓 Unlocked
                            </div>
                        </div>
                        <div class="app-title">${app.title}</div>
                        <div class="app-desc">${app.desc}</div>
                        <div class="app-action" style="color: var(--primary);">Launch App &rarr;</div>
                    `;
                    card.addEventListener('click', () => {
                        const authUrl = new URL(app.url, window.location.origin);
                        authUrl.searchParams.set('via_source', 'smarttag-lite');
                        authUrl.searchParams.set('auth_depth', authDepth.toString());
                        window.location.href = authUrl.toString();
                    });
                }
                
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLauncher();
            
            // Inject Simulator at the bottom
            const container = document.querySelector('.launcher-container');
            const simDiv = document.createElement('div');
            simDiv.style.marginTop = '4rem';
            simDiv.style.padding = '1rem';
            simDiv.style.background = 'rgba(255,255,255,0.05)';
            simDiv.style.borderRadius = '12px';
            simDiv.style.border = '1px solid rgba(255,255,255,0.1)';
            simDiv.style.textAlign = 'center';
            simDiv.innerHTML = `
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px;">Dev Tools: Simulate Auth Depth</div>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    ${[1, 2, 3, 4, 5].map(lvl => `
                        <button onclick="setAuthDepth(${lvl})" style="background: ${authDepth === lvl ? '#ff2a2a' : '#333'}; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s;">
                            Lvl ${lvl}
                        </button>
                    `).join('')}
                </div>
            `;
            container.appendChild(simDiv);
        });

        window.setAuthDepth = function(lvl) {
            localStorage.setItem('aporaksha_auth_depth', lvl);
            authDepth = lvl;
            
            // Re-render Simulator Buttons
            const buttons = document.querySelectorAll('button[onclick^="setAuthDepth"]');
            buttons.forEach((btn, idx) => {
                const buttonLvl = idx + 1;
                btn.style.background = (buttonLvl === authDepth) ? '#ff2a2a' : '#333';
            });
            
            renderLauncher();
        };
    </script>
</body>
</html>
