<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Sovereign Journal • ViaDecide</title>

  <!-- Google Fonts: Outfit & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/design-system.css" />

  <style>
    :root {
      --header-height: 70px;
    }

    body { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    /* Custom typography overrides to match old blog.html look */
    .h1 { font-family: 'Space Grotesk', sans-serif; }
    .cardBody { font-family: 'Space Grotesk', sans-serif; }
    .big { font-family: 'Outfit', sans-serif; }
    .big .accent { background: linear-gradient(135deg, #ff6b6b, #ff2a2a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Prevent selection for premium native-app feel */
    body, .site-header, .top, .card, .cardHeader, .kicker, .h1, .lead, .pill {
      user-select: none;
      -webkit-user-select: none;
    }
    input { user-select: text; -webkit-user-select: text; }

    a { color: inherit; text-decoration: none; }

    /* ===== Site Header ===== */
    .site-header {
      position: absolute; top: 0; left: 0; right: 0;
      height: var(--header-height);
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
      z-index: 1000;
    }
    .site-header .logo { color: var(--accent); font-size: 20px; font-weight: 900; letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; }
    .site-header .logo span { color: #fff; font-weight: 400; font-size: 14px; opacity: 0.6; }
    .nav-container { display: flex; align-items: center; gap: 20px; }
    .site-header nav { display: flex; gap: 20px; align-items: center; }
    .site-header nav a { color: var(--text-muted); font-weight: 700; font-size: 12px; transition: color .2s; text-transform: uppercase; letter-spacing: .08em; }
    .site-header nav a:hover, .site-header nav a.active { color: var(--accent); }

    /* Invert Mode */
    body.invert-mode { filter: invert(1) hue-rotate(180deg); background-color: #fff; }
    body.invert-mode img, body.invert-mode canvas { filter: invert(1) hue-rotate(180deg); }

    /* ===== Blog Dashboard Grid View ===== */
    .dashboard-container {
      position: absolute; inset: var(--header-height) 0 0 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 40px max(24px, var(--safeRight)) 80px max(24px, var(--safeLeft));
      z-index: 10; display: flex; flex-direction: column; align-items: center;
    }
    .dashboard-inner { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 32px; }

    .dashboard-header { text-align: center; margin-bottom: 12px; }
    .dashboard-header h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 900; margin: 0; letter-spacing: -0.04em; background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.7)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .dashboard-header p { font-size: 16px; color: var(--text-muted); margin: 8px 0 0 0; }

    /* Controls: Search & Tags */
    .controls-wrapper { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .search-box {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 16px 20px; color: #fff; font-family: inherit; font-size: 16px; outline: none;
      transition: all 0.3s;
    }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

    .tag-filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      padding: 8px 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,15,15,0.6); font-size: 12px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--accent); color: #fff; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }

    /* Articles Grid */
    .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; width: 100%; }
    .article-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 28px; display: flex; flex-direction: column; gap: 16px; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer;
    }
    .article-card:hover {
      transform: translateY(-8px); border-color: var(--accent);
      box-shadow: 0 20px 40px rgba(255, 42, 42, 0.08);
    }
    .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
    .card-title { font-size: 22px; font-weight: 800; line-height: 1.3; margin: 0; letter-spacing: -0.02em; }
    .card-desc { font-size: 14px; line-height: 1.5; color: var(--text-muted); margin: 0; flex-grow: 1; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 99px; font-size: 11px; color: var(--text-muted); }

    /* ===== Reader Deck View ===== */
    .reader-container {
      position: absolute; inset: 0; overflow: hidden; display: none; z-index: 100;
    }
    .reader-container.is-active { display: block; }

    /* We map top-nav from blog.html to .top in design-system.css but keep the original class for ease of porting */
    .top-nav {
      position: absolute; top: 0; left: 0; right: 0;
      padding: calc(16px + var(--safeTop)) calc(24px + var(--safeRight)) 16px calc(24px + var(--safeLeft));
      z-index: 200; display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0) 100%);
      pointer-events: none;
    }
    .top-nav button, .top-nav div, .top-nav span, .top-nav b { pointer-events: auto; }
    
  </style>
</head>

<body>
<div id="appWrapper">
  <div class="bg-glow"></div>

  <!-- Main Header (Grid View Mode) -->
  <header class="site-header" id="siteHeader">
    <div class="logo">🦾 PrintByDD <span>Journal</span></div>
    <div class="nav-container">
      <nav>
        <a href="index.html">Marketplace</a>
        <a href="printbydd-store.html">Hardware Store</a>
        <a href="blog.html" class="active">Journal</a>
        <a href="Viadecide-blogs.html">Essays</a>
      </nav>
      <button id="btnInvert" class="btn-icon" style="padding: 10px; font-size: 14px; margin-left: 10px;" title="Invert Theme">🌓</button>
    </div>
  </header>

  <!-- GRID VIEW DASHBOARD -->
  <main class="dashboard-container" id="dashboardView">
    <div class="dashboard-inner">
      <div class="dashboard-header">
        <h1>Sovereign Stack Journal</h1>
        <p>Architectural field-notes on local-first AI, offline-first applications, and custom hardware orchestration.</p>
      </div>

      <div class="controls-wrapper">
        <input type="text" class="search-box" id="searchBox" placeholder="Search by title, concepts, or tags..." />
        <div class="tag-filters" id="tagFilters">
          <button class="filter-btn active" data-tag="all">All posts</button>
        </div>
      </div>

      <div class="articles-grid" id="articlesGrid">
        <!-- Articles loaded dynamically -->
      </div>
    </div>
  </main>

  <!-- READER VIEW DECK -->
  <main class="reader-container" id="readerView">
    <div class="top-nav">
      <button class="back" id="btnBack">← Back</button>
      <div style="display: flex; gap: 8px;">
        <button id="btnTranslate" class="btn-icon">A/अ</button>
        <div class="pill"><span id="secLabel">SEC 1/1</span> • <span id="secName">THE COCKPIT</span></div>
      </div>
    </div>
    <div class="scroll-container" id="scrollContainer"></div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="translationToast" class="translate-toast">
    <span id="toastMsg">Translated to Hindi</span>
    <button id="btnUndoTranslate" class="btn-undo">Undo</button>
  </div>
</div>

<script src="/js/design-system.js"></script>
<script>
  (function() {
    "use strict";

    let articlesData = [];
    let activeTag = 'all';
    let currentLang = 'en';
    let SECTIONS = [];
    let toastTimer;
    let currentSlideIndex = 0;

    const dashboardView = document.getElementById('dashboardView');
    const readerView = document.getElementById('readerView');
    const siteHeader = document.getElementById('siteHeader');
    const articlesGrid = document.getElementById('articlesGrid');
    const tagFilters = document.getElementById('tagFilters');
    const searchBox = document.getElementById('searchBox');
    
    const scrollContainer = document.getElementById('scrollContainer');
    const secLabel = document.getElementById('secLabel');
    const secName = document.getElementById('secName');
    const btnBack = document.getElementById('btnBack');
    const btnTranslate = document.getElementById('btnTranslate');
    const btnInvert = document.getElementById('btnInvert');
    const toast = document.getElementById('translationToast');
    const toastMsg = document.getElementById('toastMsg');
    const btnUndo = document.getElementById('btnUndoTranslate');

    // Invert mode logic
    btnInvert.addEventListener('click', () => {
      document.body.classList.toggle('invert-mode');
    });

    // Fetch Articles Database
    async function loadArticles() {
      try {
        const res = await fetch('data/articles.json');
        articlesData = await res.json();
        renderDashboard();
        buildTagFilters();
      } catch (err) {
        articlesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--accent); padding: 40px 0;">Error loading articles. Please try again later.</div>`;
        console.error(err);
      }
    }

    // Build Tag Filters List
    function buildTagFilters() {
      const allTags = new Set();
      articlesData.forEach(a => {
        if (a.tags) a.tags.forEach(t => allTags.add(t.trim().toLowerCase()));
      });

      allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = tag;
        btn.textContent = tag;
        btn.addEventListener('click', () => selectTag(tag));
        tagFilters.appendChild(btn);
      });
    }

    function selectTag(tag) {
      activeTag = tag;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tag === tag);
      });
      renderDashboard();
    }

    // Filter and Render Dashboard Grid
    function renderDashboard() {
      const query = searchBox.value.toLowerCase().trim();
      articlesGrid.innerHTML = '';

      const filtered = articlesData.filter(a => {
        const matchesTag = (activeTag === 'all' || (a.tags && a.tags.some(t => t.toLowerCase() === activeTag)));
        const matchesQuery = !query || 
          a.title.toLowerCase().includes(query) || 
          (a.tags && a.tags.some(t => t.toLowerCase().includes(query))) ||
          (a.concepts && a.concepts.some(c => c.toLowerCase().includes(query))) ||
          (a.description && a.description.toLowerCase().includes(query));
        return matchesTag && matchesQuery;
      });

      if (filtered.length === 0) {
        articlesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">No articles match your criteria.</div>`;
        return;
      }

      filtered.forEach(article => {
        const card = document.createElement('div');
        card.className = 'article-card';
        card.addEventListener('click', () => {
          location.hash = article.slug;
        });

        const dateStr = article.date ? new Date(article.date).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'}) : '';
        const tagHtml = (article.tags || []).slice(0, 3).map(t => `<span class="tag-pill">${t}</span>`).join('');

        card.innerHTML = `
          <div class="card-meta">
            <span>By ${article.author || 'Dharam Daxini'}</span>
            <span>${dateStr}</span>
          </div>
          <h2 class="card-title">${article.title}</h2>
          <p class="card-desc">${article.description || article.summary || ''}</p>
          <div class="card-tags">${tagHtml}</div>
        `;
        articlesGrid.appendChild(card);
      });
    }

    searchBox.addEventListener('input', renderDashboard);

    // Dynamic Hindi Translation Dictionary
    const HINDI_MAP = {
      "Sovereign Stack Journal": "संप्रभु स्टैक जर्नल",
      "From Prompts to Pipelines: The Evolution of AI Systems": "प्रॉम्प्ट से पाइपलाइनों तक: एआई सिस्टम का विकास",
      "Local-First Infrastructure Is Not a Feature. It's Survival.": "लोकल-फर्स्ट इन्फ्रास्ट्रक्चर एक फीचर नहीं है। यह जीवन रक्षा है।",
      "Zayvora - Local AI Journey": "ज़ायवोरा - स्थानीय एआई यात्रा",
      "Zayvora vs Perplexity: Why They're Not Competitors": "ज़ायवोरा बनाम परप्लेक्सिटी: वे प्रतियोगी क्यों नहीं हैं",
      "daxini.xyz as a Progressive Web App": "प्रोग्रेसिव वेब ऐप के रूप में daxini.xyz",
      "Why We Stopped Using Auth Libraries": "हमने ऑथ लाइब्रेरीज़ का उपयोग क्यों बंद कर दिया",
      "Why Most AI Builders Never Ship — Dharam": "अधिकांश एआई निर्माता कभी शिप क्यों नहीं करते - धरम",
      "Local-First Is Not About Rejecting the Cloud": "लोकल-फर्स्ट क्लाउड को अस्वीकार करने के बारे में नहीं है",
      "Why Local-First Is Not About Rejecting The Cloud": "लोकल-फर्स्ट क्लाउड को अस्वीकार करने के बारे में क्यों नहीं है",
      "Invisible Systems": "अदृश्य प्रणालियाँ",
      "The Difference Between Answering and Reasoning": "जवाब देने और तर्क करने के बीच अंतर",
      "Locked": "लॉक किया गया",
      "Subscriber Exclusive": "सब्सक्राइबर एक्सक्लूसिव",
      "Continue Reading": "पढ़ना जारी रखें",
      "Attached Resources": "संलग्न संसाधन",
      "Download Assets": "संसाधन डाउनलोड करें"
    };

    // Text Translate Simulator
    function mockTranslate(text, lang) {
      if (lang === 'en') return text;
      
      if (text.includes("There was a time when I thought AI products were just prompts")) {
        return "एक समय था जब मुझे लगता था कि एआई उत्पाद सिर्फ संकेत (प्रॉम्प्ट) थे। सिस्टम नहीं। बुनियादी ढांचा नहीं। बस इनपुट से आउटपुट। चरण 1: एक एचटीएमएल फ़ाइल, एक कार्य, एक उद्देश्य। लेकिन कुछ गलत था: उपकरण जुड़े नहीं थे, याद नहीं रखते थे, या विकसित नहीं होते थे। चरण 2: प्रॉम्प्ट चेनिंग एक सिस्टम की तरह दिखती थी लेकिन नाजुक बनी रही। चरण 3: वास्तविकता का सामना - वास्तविक प्रणालियों को स्थिति, पुन: प्रयास, भंडारण, समन्वय और विफलता से निपटने की आवश्यकता होती है।";
      }
      if (text.includes("Why I moved to local inference. Not hype. Economics.")) {
        return "मैं स्थानीय अनुमान (लोकल इन्फेरेंस) पर क्यों गया। कोई प्रचार नहीं। अर्थशास्त्र। गलत बनाम सही प्रश्न। गलत प्रश्न: एआई को स्थानीय स्तर पर क्यों ले जाएं? असली सवाल: निर्भरता की वास्तव में क्या कीमत चुकानी पड़ती है? एपीआई डेथ स्पाइरल: एपीआई के माध्यम से सब कुछ रूट किया गया। इसने काम किया। जब तक कि यह बड़े पैमाने पर नहीं हुआ।";
      }
      if (text.includes("How I moved 5 production products off OpenAI")) {
        return "मैंने कैसे 5 उत्पादक उत्पादों को ओपनएआई से हटा दिया, अपने मार्जिन को पुनः प्राप्त किया, और $900 मैक मिनी और लामा 3.1 का उपयोग करके शून्य-लागत स्थानीय अनुमान प्राप्त किया। bootstrap पर पांच उत्पादों को चलाने वाले एक भारतीय संस्थापक के लिए, यह हर महीने वास्तविक पैसा था। daxini.space, LogicHub, SkillHex, ViaDecide, और hanuman.solutions सब स्थानीय स्तर पर काम कर रहे हैं।";
      }
      if (text.includes("Isn't Zayvora competing with Perplexity?")) {
        return "क्या ज़ायवोरा परप्लेक्सिटी के साथ प्रतिस्पर्धा कर रहा है? इसका जवाब है नहीं। बिल्कुल अलग खेल। दोनों एआई हैं। दोनों के इंटरफेस साफ हैं। दोनों जटिल समस्याओं के बारे में सोचते हैं। लेकिन वे अलग-अलग लोगों के लिए अलग-अलग समस्याओं का समाधान करते हैं। परप्लेक्सिटी खोज में सुधार करता है, ज़ायवोरा पूरे कोडबेस को स्वायत्त रूप से स्केल करता है।";
      }
      
      let translated = text;
      translated = translated.replace(/\bAI\b/g, "एआई");
      translated = translated.replace(/\bsoftware\b/g, "सॉफ्टवेयर");
      translated = translated.replace(/\blocal-first\b/g, "स्थानीय-प्रथम");
      translated = translated.replace(/\bdevelopers\b/g, "विकासकर्ता");
      translated = translated.replace(/\bstartup\b/g, "स्टार्टअप");
      translated = translated.replace(/\bcloud\b/g, "क्लाउड");
      translated = translated.replace(/\bservers\b/g, "सर्वर");
      
      return translated;
    }

    // Scroll Snapping Section Builder
    function chunkContent(contentStr) {
      const sentences = contentStr.match(/[^.!?]+[.!?]+/g) || [contentStr];
      let chunks = [];
      let currentChunk = [];
      let currentLen = 0;
      for (const s of sentences) {
        currentChunk.push(s.trim());
        currentLen += s.length;
        if (currentLen > 450) {
          chunks.push(currentChunk.join(' '));
          currentChunk = [];
          currentLen = 0;
        }
      }
      if (currentChunk.length > 0) chunks.push(currentChunk.join(' '));
      if (chunks.length === 0) chunks.push("No content.");
      return chunks;
    }

    function renderReader(article) {
      scrollContainer.innerHTML = '';
      const chunks = chunkContent(article.content || "");
      SECTIONS = [];

      // Section 1: Intro Card
      SECTIONS.push({
        name: "INTRODUCTION",
        kicker: "Part 1",
        title: { en: article.title, hi: HINDI_MAP[article.title] || article.title },
        html: {
          en: () => `
            <div class="big">${article.title}</div>
            <p class="lead">${chunks[0]}</p>
            <p class="meta" style="color:var(--text-muted); font-size:12px; margin-top:24px;">By ${article.author || 'Dharam Daxini'} • ${article.date || ''}</p>
          `,
          hi: () => `
            <div class="big">${HINDI_MAP[article.title] || article.title}</div>
            <p class="lead">${mockTranslate(chunks[0], 'hi')}</p>
            <p class="meta" style="color:var(--text-muted); font-size:12px; margin-top:24px;">द्वारा ${article.author || 'धरम दक्सिनी'} • ${article.date || ''}</p>
          `
        }
      });

      // Subsequent Chunks
      for (let i = 1; i < chunks.length; i++) {
        SECTIONS.push({
          name: `PART ${i+1}`,
          kicker: `Continued`,
          title: { en: article.title, hi: HINDI_MAP[article.title] || article.title },
          html: {
            en: () => `<p class="lead">${chunks[i]}</p>`,
            hi: () => `<p class="lead">${mockTranslate(chunks[i], 'hi')}</p>`
          }
        });
      }

      // Render all section cards
      SECTIONS.forEach((sec, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'section-wrapper';
        wrapper.dataset.index = idx;
        wrapper.dataset.name = sec.name;

        wrapper.innerHTML = `
          <div class="card">
            <div class="cardHeader" style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div class="kicker">${sec.kicker}</div>
                <h2 class="h1">${currentLang === 'en' ? sec.title.en : sec.title.hi}</h2>
              </div>
              <button class="btn-icon card-lang-toggle" onclick="triggerTranslation()" style="font-size:12px; font-weight:700; color:var(--accent); border:1px solid rgba(255,255,255,0.1); padding:4px 8px; border-radius:6px; background:rgba(0,0,0,0.2); pointer-events:auto; cursor:pointer;">A/अ</button>
            </div>
            <div class="cardBody">
              ${currentLang === 'en' ? sec.html.en() : sec.html.hi()}
            </div>
          </div>
          <div class="hint">
            <span>Scroll Down to Continue</span>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          </div>
        `;
        scrollContainer.appendChild(wrapper);
      });

      // Initialize Section Tracking using the global function from design-system.js
      if (window.initSectionTracking) {
         window.initSectionTracking(scrollContainer, scrollContainer);
         
         // Setup scroll state updates that were custom to blog.html
         const observerOptions = { root: scrollContainer, threshold: 0.6 };
         const observer = new IntersectionObserver((entries) => {
           entries.forEach(entry => {
             if (entry.isIntersecting) {
               currentSlideIndex = parseInt(entry.target.dataset.index);
             }
           });
         }, observerOptions);
         document.querySelectorAll('.section-wrapper').forEach(wrapper => observer.observe(wrapper));
      }
      
      const targetWrapper = scrollContainer.querySelectorAll('.section-wrapper')[currentSlideIndex];
      if (targetWrapper) {
        targetWrapper.scrollIntoView({ block: 'nearest', behavior: 'instant' });
      } else {
        scrollContainer.scrollTop = 0;
      }
    }

    // Translation Handlers
    window.triggerTranslation = function(lang) {
      if (!lang) lang = currentLang === 'en' ? 'hi' : 'en';
      const prevIndex = currentSlideIndex;
      currentLang = lang;
      const activeSlug = location.hash.slice(1);
      const article = articlesData.find(a => a.slug === activeSlug);
      if (article) renderReader(article);

      const targets = scrollContainer.querySelectorAll('.section-wrapper');
      if (targets[prevIndex]) {
        targets[prevIndex].scrollIntoView({ block: 'nearest', behavior: 'instant' });
      }

      if (window.showToast) {
        window.showToast(lang === 'hi' ? "Translated to Hindi" : "Reverted to English", 4000);
      }
      if (lang === 'hi') {
        btnUndo.style.display = 'block';
      } else {
        btnUndo.style.display = 'none';
      }
    }

    btnTranslate.addEventListener('click', () => {
      triggerTranslation(currentLang === 'en' ? 'hi' : 'en');
    });
    btnUndo.addEventListener('click', () => {
      triggerTranslation('en');
    });

    // Hash Router Handler
    function handleRouting() {
      const hash = location.hash.slice(1);
      if (hash) {
        const article = articlesData.find(a => a.slug === hash);
        if (article) {
          dashboardView.style.display = 'none';
          siteHeader.style.display = 'none';
          readerView.classList.add('is-active');
          renderReader(article);
          return;
        }
      }
      
      readerView.classList.remove('is-active');
      dashboardView.style.display = 'flex';
      siteHeader.style.display = 'flex';
      renderDashboard();
    }

    window.addEventListener('hashchange', handleRouting);
    btnBack.addEventListener('click', () => {
      location.hash = '';
    });

    // Run Load
    loadArticles().then(() => {
      handleRouting();
    });

  })();
</script>
</body>
</html>
