<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/tools/engine/seed-quality-scorer/" />
  <title>Seed Quality Scorer · Layer 0</title>
  <style>
    :root {
      --bg: #f4f1e8;
      --panel: #fbfaf6;
      --line: #d7d0c0;
      --text: #1f2a1f;
      --muted: #5a665a;
      --soil: #5c422b;
      --leaf: #2e6f3e;
      --accent: #1f5b79;
      --code-bg: #18221b;
      --code-fg: #e7f2e8;
      --warn: #885300;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8f5ee 0%, var(--bg) 100%);
    }

    .app {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
      display: grid;
      gap: 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 8px 18px rgba(28, 40, 28, 0.06);
    }

    h1, h2, h3 { margin: 0 0 0.5rem; }
    p { margin: 0.25rem 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    label {
      display: block;
      margin: 0.75rem 0 0.35rem;
      color: var(--soil);
      font-weight: 650;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #bbb19d;
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      font: inherit;
      color: var(--text);
      background: white;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0.62rem 0.9rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .primary { background: var(--leaf); color: white; }
    .secondary { background: #ddd3be; color: #2f2316; }
    .accent { background: var(--accent); color: white; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem;
      background: #f7f4ec;
    }

    .stat small { color: var(--muted); display: block; }
    .stat strong { font-size: 1.08rem; }

    pre {
      margin: 0;
      border-radius: 10px;
      padding: 0.85rem;
      overflow: auto;
      min-height: 180px;
      background: var(--code-bg);
      color: var(--code-fg);
      line-height: 1.35;
      font-size: 0.84rem;
    }

    .hint { color: var(--warn); font-size: 0.89rem; }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
  <script src="../../../shared/vd-nav-fix.js"></script>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Seed Quality Scorer · Layer 0 Utility</h1>
      <p>Score reusable knowledge seeds using fundamentals, depth, and output readiness.</p>
      <p class="hint">Roots = fundamentals, trunk = depth, fruits = outputs.</p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Engine Controls</h2>
        <div class="row">
          <div>
            <label for="growthFocus">Growth Focus</label>
            <select id="growthFocus">
              <option value="balanced">Balanced</option>
              <option value="root-heavy">Root Heavy</option>
              <option value="fruit-heavy">Fruit Heavy</option>
            </select>
          </div>
          <div>
            <label for="tickMs">Simulation Tick (ms)</label>
            <input id="tickMs" type="number" min="250" max="5000" step="50" value="1200" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="weightClarity">Weight · Clarity</label>
            <input id="weightClarity" type="number" min="1" max="100" step="1" value="35" />
          </div>
          <div>
            <label for="weightViability">Weight · Viability</label>
            <input id="weightViability" type="number" min="1" max="100" step="1" value="35" />
          </div>
        </div>

        <label for="weightGrowth">Weight · Growth Potential</label>
        <input id="weightGrowth" type="number" min="1" max="100" step="1" value="30" />

        <label for="seedInput">Seed Batch JSON</label>
        <textarea id="seedInput" aria-label="Seed batch input"></textarea>

        <div class="toolbar">
          <button id="scoreBtn" class="primary" type="button">Run Score Cycle</button>
          <button id="startBtn" class="accent" type="button">Start Simulation</button>
          <button id="stopBtn" class="secondary" type="button">Stop</button>
          <button id="resetBtn" class="secondary" type="button">Reset Demo</button>
          <button id="exportBtn" class="secondary" type="button">Export Snapshot</button>
        </div>
      </article>

      <article class="card">
        <h2>Engine Readout</h2>
        <div class="stats">
          <div class="stat"><small>Tick</small><strong id="tickCount">0</strong></div>
          <div class="stat"><small>Status</small><strong id="engineStatus">idle</strong></div>
          <div class="stat"><small>Seeds</small><strong id="seedCount">0</strong></div>
          <div class="stat"><small>Average Score</small><strong id="avgScore">0.0</strong></div>
          <div class="stat"><small>Top Tier</small><strong id="topTier">-</strong></div>
        </div>

        <h3>State Snapshot</h3>
        <pre id="snapshotOutput" aria-live="polite"></pre>

        <h3 style="margin-top: 0.8rem;">Event Log</h3>
        <pre id="eventLogOutput"></pre>
      </article>
    </section>
  </main>
  <script src="./tool.js"></script>
</body>
</html>
