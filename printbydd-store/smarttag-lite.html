<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>SmartTag Lite • PrintByDD</title>

  <!-- NOTE (offline):
    This page will work offline ONLY if you host these files locally:
      1) three.min.js (instead of CDN)
      2) the STL file next to this HTML (see STL_URL below)
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{
      --bg:#050505;
      --card-bg: rgba(18, 18, 20, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text:#fdfdfd;
      --text-muted: rgba(242, 242, 242, 0.65);
      --accent:#ff2a2a;
      --accent2:#22c55e;
      --accent-glow: rgba(255, 42, 42, 0.15);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      --radius: 24px;

      --safeTop: env(safe-area-inset-top, 0px);
      --safeBottom: env(safe-area-inset-bottom, 0px);
      --safeLeft: env(safe-area-inset-left, 0px);
      --safeRight: env(safe-area-inset-right, 0px);

      --maxw: 880px;
      --header-height: 60px;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:100%; height:100dvh; margin:0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow:hidden; overscroll-behavior-y:none;
      -webkit-font-smoothing: antialiased;
    }

    /* No text selection (store feel) */
    body, .site-header, .top, .bottom-nav, .card, .cardHeader, .kicker, .h1, .cardBody, .lead, .qt, .ul, .steps, .sg, .pill {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea { user-select:text; -webkit-user-select:text; }

    a{ color:inherit; text-decoration:none; }
    button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; -webkit-tap-highlight-color: transparent; }

    /* ===== Site Header ===== */
    .site-header{
      position:absolute; top:0; left:0; right:0;
      height: var(--header-height);
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
      z-index:1000;
    }
    .site-header .logo{ color:var(--accent); font-size:18px; font-weight:900; letter-spacing:-0.02em; }
    .nav-container { display:flex; align-items:center; gap:18px; }
    .site-header nav{ display:flex; gap:18px; align-items:center; }
    .site-header nav a{ color:var(--text-muted); font-weight:800; font-size:13px; transition:color .2s; text-transform:uppercase; letter-spacing:.05em; }
    .site-header nav a:hover, .site-header nav a.active{ color:var(--text); }

    /* Invert theme method (your store style) */
    body.invert-mode .site-header{ filter:invert(1) hue-rotate(180deg); }
    body.invert-mode #appWrapper, body.invert-mode #translationToast, body.invert-mode #rotatePopup{ filter:invert(1) hue-rotate(180deg); }
    body.invert-mode img, body.invert-mode video, body.invert-mode canvas{ filter:invert(1) hue-rotate(180deg); }

    #appWrapper{ position:relative; width:100vw; height:100dvh; transform-origin:center center; transition:transform 0.4s cubic-bezier(0.25,1,0.5,1); overflow:hidden; }
    #appWrapper.forced-landscape{ width:100dvh; height:100vw; position:absolute; top:50%; left:50%; margin-top:-50vw; margin-left:-50dvh; }

    .bg-glow{
      position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,42,42,0.16), transparent 60%),
        radial-gradient(circle at 85% 100%, rgba(255,255,255,0.03), transparent 60%);
      z-index:0;
    }

    .top{
      position:absolute; top:var(--header-height); left:0; right:0;
      padding:calc(16px + var(--safeTop)) calc(16px + var(--safeRight)) 16px calc(16px + var(--safeLeft));
      z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(5,5,5,0.95) 0%,rgba(5,5,5,0) 100%);
    }
    .top > *{ pointer-events:auto; }
    .top-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

    .back, .pill, .btn-icon{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 16px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(15,15,15,0.65);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:all 0.2s ease;
    }
    .btn-icon{ padding:10px; font-weight:950; color:var(--accent); width:38px; height:38px; }
    .btn-icon:active, .back:active{ transform:scale(0.96); }
    .back{ color:rgba(255,255,255,0.92); font-weight:900; font-size:14px; cursor:pointer;}
    .pill{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; }
    .pill b{ color:#fff; letter-spacing:0.1em; font-weight:950; }

    .scroll-container{
      position:absolute; top:var(--header-height); bottom:0; left:0; right:0;
      overflow-y:auto; overflow-x:hidden;
      scroll-snap-type:y mandatory; scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
      z-index:10;
    }
    .scroll-container::-webkit-scrollbar{ display:none; }

    .section-wrapper{
      height:100%; width:100%;
      scroll-snap-align:start; scroll-snap-stop:always;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:calc(90px + var(--safeTop)) calc(16px + var(--safeRight)) calc(120px + var(--safeBottom)) calc(16px + var(--safeLeft));
      position:relative;
    }

    .card{
      width:100%; max-width:var(--maxw);
      flex:1; min-height:0;
      border-radius:var(--radius);
      border:1px solid var(--card-border);
      background:var(--card-bg);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow);
      display:flex; flex-direction:column;
      overflow:hidden;
      opacity:0.30;
      transform:scale(0.92) translateY(30px);
      transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .section-wrapper.is-active .card{ opacity:1; transform:scale(1) translateY(0); }

    .cardHeader{
      padding:24px 24px 20px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      background:rgba(0,0,0,0.3);
      flex-shrink:0;
    }
    .kicker{ font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; font-weight:950; }
    .h1{ margin:0; font-size:clamp(22px,5vw,28px); line-height:1.3; letter-spacing:-0.01em; font-weight:950; }
    .cardBody{ padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }

    .big{ font-size:clamp(28px,6vw,46px); line-height:1.12; font-weight:950; letter-spacing:-0.03em; margin:0 0 18px; }
    .big .r, .r{ background:linear-gradient(135deg,#ff6b6b,#ff2a2a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .lead{ font-size:17px; line-height:1.65; color:rgba(255,255,255,0.85); margin:0 0 16px; }
    .qt{ margin:18px 0 10px; padding:14px 18px; border-left:3px solid var(--accent); background:linear-gradient(90deg,var(--accent-glow),transparent); border-radius:0 12px 12px 0; color:rgba(255,255,255,0.95); line-height:1.65; font-size:15px; font-style:italic; }

    .ul{ margin:14px 0; padding:0; list-style:none; color:rgba(255,255,255,0.78); font-size:15px; line-height:1.65; }
    .ul li{ position:relative; padding-left:22px; margin:10px 0; }
    .ul li::before{ content:'→'; position:absolute; left:0; color:var(--accent); font-weight:950; }

    .steps{ display:flex; flex-direction:column; gap:16px; margin:16px 0; }
    .step{ display:flex; gap:14px; align-items:flex-start; }
    .step-num{ flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font-weight:950; font-size:14px; display:flex; align-items:center; justify-content:center; }
    .step-title{ font-weight:950; font-size:15px; color:#fff; margin-bottom:4px; }
    .step-desc{ font-size:14px; color:rgba(255,255,255,0.72); line-height:1.6; }

    .sg{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .sn{ background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px 10px; text-align:center; }
    .sv{ font-size:22px; font-weight:950; color:#fff; line-height:1.1; letter-spacing:-0.02em; }
    .slbl{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.45); margin-top:6px; }

    .cp{
      display:flex; align-items:center; justify-content:center;
      border:none; border-radius:16px;
      background:linear-gradient(135deg,#ff4444,#b80000);
      cursor:pointer; overflow:hidden; position:relative;
      box-shadow:0 8px 28px rgba(255,42,42,0.38);
      transition:transform .2s,filter .2s;
      min-height:54px; width:100%; padding:0;
    }
    .cp.alt{
      background:linear-gradient(135deg,#111,#000);
      box-shadow:0 8px 28px rgba(0,0,0,0.55);
    }
    .cp.green{
      background:linear-gradient(135deg,#1dd15f,#0a7a2f);
      box-shadow:0 8px 28px rgba(34,197,94,0.28);
    }
    .cp:active{ transform:scale(0.97); }
    .cpulse{ position:absolute; inset:0; background:rgba(255,255,255,0.15); animation:cpa 2s infinite; }
    @keyframes cpa{ 0%,100%{opacity:0} 50%{opacity:1} }
    .ci{ position:relative; z-index:1; display:flex; align-items:center; gap:8px; color:#fff; font-weight:950; font-size:15px; padding:0 24px; }
    .ca{ background:rgba(255,255,255,0.2); border-radius:8px; padding:4px 10px; font-size:14px; }

    /* STL viewer */
    .stl-viewer-wrap{
      position:relative; width:100%;
      height: 280px; min-height: 280px; max-height: 280px;
      border-radius:16px; overflow:hidden;
      border:1px solid rgba(255,255,255,0.1);
      background:#0a0a0a; margin-bottom:14px;
      touch-action:none;
    }
    .stl-viewer-wrap canvas{ display:block; width:100%!important; height:100%!important; object-fit:contain; }
    .stl-loading{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:12px; color:rgba(255,255,255,0.45);
      letter-spacing:0.12em; text-transform:uppercase;
      pointer-events:none; background:#0a0a0a;
      transition:opacity 0.4s; padding:16px; text-align:center; z-index:5;
    }
    .stl-loading.hidden{ opacity:0; pointer-events:none; }
    .stl-hint{
      position:absolute; bottom:10px; left:50%;
      transform:translateX(-50%);
      font-size:10px; color:rgba(255,255,255,0.25);
      letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap;
      pointer-events:none; z-index:5;
    }

    /* Color panel */
    .stl-color-panel{ margin-top:8px; padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.22); }
    .stl-color-title{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.45); font-weight:950; margin:0 0 8px; }
    .stl-color-row{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; margin:8px 0 0; }
    .stl-color-btn{
      display:flex; flex-direction:row; align-items:center; gap:10px;
      padding:10px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.35);
      transition:all 0.2s;
      font-size:12px; font-weight:900;
      color:rgba(255,255,255,0.72);
      min-width:118px;
    }
    .stl-color-btn:active{ transform:scale(0.97); }
    .stl-color-btn.active{ border-color:var(--accent); background:var(--accent-glow); color:#fff; }
    .stl-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); flex-shrink:0; }
    @media (max-width:420px){ .stl-color-btn{ min-width:46%; } }

    
    /* New Gallery CSS */
    .gallery-wrap {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 12px;
      margin-top: 16px;
      scrollbar-width: none;
    }
    .gallery-wrap::-webkit-scrollbar { display: none; }
    .gallery-item {
      scroll-snap-align: center;
      flex-shrink: 0;
      width: 260px;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 20px 12px 10px;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    /* Benefits Grid */
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .benefit-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .benefit-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .benefit-icon {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--accent);
    }
    .benefit-title {
      font-weight: 950;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .benefit-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
    }

    /* Trust Row */
    .trust-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
    }
    .trust-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      flex: 1;
    }
    .trust-item svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent2);
      fill: none;
      stroke-width: 2;
    }
    .trust-label {
      font-size: 11px;
      font-weight: 800;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Form */
    .form-card{
      margin-top:12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(0,0,0,0.25);
      padding:14px;
    }
    .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:560px){ .fgrid{ grid-template-columns:1fr; } }
    .flabel{
      font-size:10px; font-weight:950; letter-spacing:0.12em; text-transform:uppercase;
      color:rgba(255,255,255,0.45);
      margin:0 0 6px;
    }
    .finp{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(8,8,10,0.65);
      color:#fff;
      outline:none;
      font-size:14px;
      transition:border-color .15s, box-shadow .15s;
    }
    .finp:focus{
      border-color: rgba(255,42,42,0.65);
      box-shadow:0 0 0 3px rgba(255,42,42,0.12);
    }
    .help{
      margin-top:10px;
      font-size:12px;
      color:rgba(255,255,255,0.55);
      line-height:1.6;
    }
    .preview-chip{
      margin-top:12px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      font-size:12px;
      color:rgba(255,255,255,0.85);
      font-weight:900;
      max-width:100%;
    }
    .chip b{ color:#fff; }
    .chip small{ color:rgba(255,255,255,0.60); font-weight:900; }
    .chip .dot{ width:8px; height:8px; border-radius:999px; background:var(--accent2); box-shadow:0 0 0 3px rgba(34,197,94,0.12); }

    /* Toast + rotate */
    .rotate-popup{
      position:fixed; bottom:80px; left:50%;
      transform:translateX(-50%) scale(0.9);
      background:var(--accent); color:#fff;
      padding:12px 24px; border-radius:999px;
      font-size:14px; font-weight:950;
      display:flex; align-items:center; gap:10px;
      box-shadow:0 12px 30px rgba(255,42,42,0.35);
      opacity:0; pointer-events:none;
      transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
      z-index:9999;
    }
    .rotate-popup.is-visible{ opacity:1; pointer-events:auto; transform:translateX(-50%) scale(1); }

    /* Bottom nav */
    .bottom-nav{
      position:fixed;
      left:max(10px,var(--safeLeft)); right:max(10px,var(--safeRight));
      bottom:calc(10px + var(--safeBottom));
      height:64px;
      display:flex; align-items:center; gap:10px;
      padding:10px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(10,10,12,0.78);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 60px rgba(0,0,0,0.55);
      z-index:1200;
    }
    .bn-btn{
      width:44px; height:44px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.92);
      font-weight:950;
      display:flex; align-items:center; justify-content:center;
      transition:transform .2s,opacity .2s;
      flex-shrink:0;
    }
    .bn-btn:active{ transform:scale(0.96); }
    .bn-btn:disabled{ opacity:0.35; pointer-events:none; }
    .bn-dots{ flex:1; display:flex; gap:8px; align-items:center; justify-content:center; min-width:0; overflow:hidden; }
    .bn-dot{
      width:8px; height:8px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.10);
      transition:background .2s,border-color .2s,width .2s;
      flex-shrink:0;
    }
    .bn-dot.active{ width:22px; background:var(--accent); border-color:rgba(255,42,42,0.7); }
    .bn-cta{
      height:44px; padding:0 16px;
      border-radius:14px;
      border:none;
      background:linear-gradient(135deg,#ff4444,#b80000);
      color:#fff; font-weight:950;
      letter-spacing:-0.01em;
      display:flex; align-items:center; gap:10px;
      box-shadow:0 10px 26px rgba(255,42,42,0.35);
      transition:transform .2s,filter .2s;
      white-space:nowrap;
      flex-shrink:0;
    }
    .bn-cta:active{ transform:scale(0.97); filter:brightness(1.06); }
    .bn-cta .bn-tag{ font-size:12px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.18); }

    .hint{
      position:absolute; bottom:calc(16px + var(--safeBottom)); left:50%;
      transform:translateX(-50%);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      color:rgba(255,255,255,0.4);
      font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
      pointer-events:none;
      animation:pulse 2s infinite;
      z-index:100;
    }
    .hint svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.5; }
    @keyframes pulse{ 0%,100%{transform:translateX(-50%) translateY(0);opacity:0.6} 50%{transform:translateX(-50%) translateY(5px);opacity:1} }
    .section-wrapper:last-child .hint{ display:none; }

    /* Refined Customization UI Styles */
    .dest-selector {
      display: flex;
      gap: 10px;
      margin: 10px 0 16px;
      flex-wrap: wrap;
    }
    .dest-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 12px;
      transition: all 0.2s;
      flex: 1 1 30%;
      justify-content: center;
      min-width: 120px;
    }
    .dest-option:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
    }
    .dest-option input[type="radio"] {
      margin: 0;
      accent-color: var(--accent2);

  <div id="appWrapper">

      <a class="back" href="/keychain" id="backBtn">← Back</a>

        <button id="btnTheme" class="btn-icon" aria-label="Toggle theme" title="Toggle theme">☾</button>

  <div id="rotatePopup" class="rotate-popup"></div>

  <script>
  (function(){
    "use strict";

    // ===========================
    // ROUTE / NAV (store + local)
    // ===========================
    function routeTo(htmlPath, storePath){
      return (location.hostname === "store.viadecide.com") ? storePath : htmlPath;
    }

    // Keep your store canonicalization (same pattern as homepage)
    (function fixStoreLinks(){
      const isStoreDomain = location.hostname === 'store.viadecide.com';
      if (!isStoreDomain) return;
      if (location.pathname === '/printbydd') history.replaceState(null, '', '/printbydd/');
    })();

    // If you use "pretty routes" on store domain, these are safe defaults:
    // Home: /printbydd/
    // Products list: /printbydd/products  (or your keychain route if that's your "products")
    // Blog: /printbydd/gifts-that-mean-more  (adjust if your router uses a different slug)
    document.getElementById("logoLink").href = routeTo("./index.html", "/printbydd/");
    document.getElementById("navHome").href  = routeTo("./index.html", "/printbydd/");
    document.getElementById("navProds").href = routeTo("./keychain.html", "/printbydd/products");
    document.getElementById("navBlog").href  = routeTo("./gifts-that-mean-more.html", "/printbydd/gifts-that-mean-more");

    // Back button: use history if possible, else fallback to products
    const backBtn = document.getElementById("backBtn");
    backBtn.href = routeTo("./keychain.html", "/printbydd/products");
    backBtn.addEventListener("click", function(e){
      e.preventDefault();
      if (window.history.length > 1) history.back();
      else window.location.href = backBtn.href;
    });

    // ========= CONFIG =========
    // 3D model served from ./models/nfc.glb
    const WA_NUMBER = "916351537770";
    const PRODUCT_NAME = "SmartTag Lite (NFC + QR)";
    const PRICE_SINGLE = "₹399";
    const PRICE_SINGLE_NOTE = "excl. GST + shipping";
    const PRICE_BULK = "₹249+ / unit";
    const PRICE_BULK_NOTE = "25+ units, quote on WhatsApp";

    // ========= THEME =========
    const THEME_KEY = "VD_INVERT_THEME";
    const btnTheme = document.getElementById("btnTheme");
    function setInvert(on){
      document.body.classList.toggle("invert-mode", !!on);
      btnTheme.textContent = on ? "☀" : "☾";
      try{ localStorage.setItem(THEME_KEY, on ? "1" : "0"); }catch (e) { try { if (typeof sovereignAnalytics !== 'undefined') sovereignAnalytics.log('[SILENT CATCH]', e); else console.warn('[SILENT CATCH]', e); } catch(__e) {} }
    }
    (function initTheme(){
      let s="0"; try{ s = localStorage.getItem(THEME_KEY) || "0"; }catch (e) { try { if (typeof sovereignAnalytics !== 'undefined') sovereignAnalytics.log('[SILENT CATCH]', e); else console.warn('[SILENT CATCH]', e); } catch(__e) {} }
      setInvert(s==="1");
    })();
    btnTheme.addEventListener("click", () => setInvert(!document.body.classList.contains("invert-mode")));

    // ========= 3D VIEWER =========
    let scene=null, renderer=null, camera=null, group=null;
    let inited=false;

    function createPillMesh(isFront) {
      const pillGroup = new THREE.Group();

      // Matte Black Body Material
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x121212,
        roughness: 0.75,
        metalness: 0.1
      });

      // Cylinder middle
      const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
      const cyl = new THREE.Mesh(cylGeo, bodyMat);
      pillGroup.add(cyl);

      // Top sphere cap
      const capGeo = new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const topCap = new THREE.Mesh(capGeo, bodyMat);
      topCap.position.y = 0.6;
      pillGroup.add(topCap);

      // Bottom sphere cap
      const bottomCap = new THREE.Mesh(capGeo, bodyMat);
      bottomCap.position.y = -0.6;
      bottomCap.rotation.x = Math.PI; // flip to face down
      pillGroup.add(bottomCap);

      // Metallic keychain ring on top cap
      const ringGeo = new THREE.TorusGeometry(0.15, 0.03, 8, 24);
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        roughness: 0.2,
        metalness: 0.9
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.y = 1.05;
      ring.rotation.x = Math.PI / 2;
      pillGroup.add(ring);

      if (isFront) {
        // Front side: White Sticker plane with QR placeholder
        const stickerGeo = new THREE.PlaneGeometry(0.62, 0.62);
        
        // Procedural QR Canvas Texture
        const qrCanvas = document.createElement('canvas');
        qrCanvas.width = 64;
        qrCanvas.height = 64;
        const ctx = qrCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 64, 64);
        ctx.fillStyle = '#000000';
        
        // 3 Position squares
        ctx.fillRect(2, 2, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(6, 6, 8, 8);
        ctx.fillStyle = '#000000';
        ctx.fillRect(8, 8, 4, 4);

        ctx.fillRect(46, 2, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(50, 6, 8, 8);
        ctx.fillStyle = '#000000';
        ctx.fillRect(52, 8, 4, 4);

        ctx.fillRect(2, 46, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(6, 50, 8, 8);
        ctx.fillStyle = '#000000';
        ctx.fillRect(8, 52, 4, 4);

        // Random pixels
        ctx.fillStyle = '#000000';
        for (let y = 0; y < 64; y += 4) {
          for (let x = 0; x < 64; x += 4) {
            if ((x < 20 && y < 20) || (x > 44 && y < 20) || (x < 20 && y > 44)) continue;
            if (Math.random() > 0.45) {
              ctx.fillRect(x, y, 4, 4);
            }
          }
        }
        const qrTexture = new THREE.CanvasTexture(qrCanvas);
        const stickerMat = new THREE.MeshStandardMaterial({
          map: qrTexture,
          roughness: 0.9
        });
        
        const sticker = new THREE.Mesh(stickerGeo, stickerMat);
        sticker.position.set(0, 0, 0.505);
        pillGroup.add(sticker);
      } else {
        // Back side: Glowing copper outline antenna
        const antennaGeo = new THREE.RingGeometry(0.28, 0.34, 32);
        const antennaMat = new THREE.MeshBasicMaterial({
          color: 0x00ffcc, // glowing cyan outline
          side: THREE.DoubleSide
        });
        const antenna = new THREE.Mesh(antennaGeo, antennaMat);
        antenna.position.set(0, 0, 0.505);
        pillGroup.add(antenna);

        // NFC chip in the middle
        const chipGeo = new THREE.BoxGeometry(0.12, 0.12, 0.02);
        const chipMat = new THREE.MeshStandardMaterial({
          color: 0x333333,
          roughness: 0.4,
          metalness: 0.8
        });
        const chip = new THREE.Mesh(chipGeo, chipMat);
        chip.position.set(0, 0, 0.51);
        pillGroup.add(chip);
      }

      return pillGroup;
    }

        window.initSTLViewer = async function(){
      if(inited) return;
      const wrap    = document.getElementById('stl-viewer-wrap');
      const canvas  = document.getElementById('stl-canvas');
      const loading = document.getElementById('stl-loading');
      if(!wrap || !canvas) return;
      inited = true;

      const W = wrap.clientWidth || 320;
      const H = 280;

      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(W, H, false);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
      camera.position.set(0, 0, 4.2);

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const d1 = new THREE.DirectionalLight(0xffffff, 0.95); d1.position.set(2.5, 3, 2); scene.add(d1);
      const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(-2, -1, -2); scene.add(d2);

      group = new THREE.Group();
      scene.add(group);

      // GLTFLoader is loaded via separate CDN script and attaches to THREE namespace
      const GLTFLoaderClass = THREE.GLTFLoader || (window.THREE && window.THREE.GLTFLoader);
      if (!GLTFLoaderClass) {
        console.error('GLTFLoader not found. Falling back to primitive.');
        const fallback = createPillMesh(true);
        group.add(fallback);
        if(loading) loading.classList.add('hidden');
        return;
      }
      const loader = new GLTFLoaderClass();
      loader.load('./models/nfc.glb', (gltf) => {
        const model = gltf.scene;
        
        // Center the model
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        
        // Scale to fit
        const sz = new THREE.Vector3(); 
        box.getSize(sz);
        const maxDim = Math.max(sz.x, sz.y, sz.z) || 1;
        model.scale.setScalar(2.45 / maxDim);
        
        // Set standard black material for the model
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0x1a1a1a,
              roughness: 0.3,
              metalness: 0.8

          formState.link = "https://wa.me/91" + cleanedDigits;

    function updateValidationAndCapacity() {
      const msgEl = document.getElementById("validation-msg");
      const fillEl = document.getElementById("capacity-fill");
      const textEl = document.getElementById("capacity-text");
      const submitBtn = document.getElementById("submit-btn");
      const bulkBtn = document.getElementById("bulk-btn");

      let isValid = false;
      let activePayload = "";
      let errorMsg = "";

      if (formState.destType === "whatsapp") {
        const waRegex = /^\+91[6-9]\d{9}$/;
        const trimmedVal = formState.rawLink.trim();
        if (waRegex.test(trimmedVal)) {
          isValid = true;
          activePayload = formState.link;
        } else {
          errorMsg = "Invalid WhatsApp number (format: +91 followed by 10-digit mobile number)";
        }
      } else if (formState.destType === "website") {
        const urlRegex = /^https?:\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}([\/?#].*)?$/i;
        const activeUrl = formState.link;
        if (urlRegex.test(activeUrl)) {
          isValid = true;
          activePayload = activeUrl;
        } else {
          errorMsg = "Invalid URL format (must be a valid domain with http:// or https://)";
        }
      } else if (formState.destType === "vcard") {
        const phoneRegex = /^\+91[6-9]\d{9}$/;
        const nameVal = formState.vName.trim();
        const phoneVal = formState.vPhone.trim();

        if (nameVal.length > 0 && phoneRegex.test(phoneVal)) {
          isValid = true;
          // Generate compact vCard
          activePayload = `BEGIN:VCARD\r\nVERSION:3.0\r\nFN:${nameVal}\r\nTEL;TYPE=CELL:${phoneVal}\r\nEND:VCARD`;
        } else {
          if (nameVal.length === 0) {
            errorMsg = "Full Name is required for vCard";
          } else {
            errorMsg = "Invalid Phone Number format (e.g., +919876543210)";
          }
        }
      }

      // NDEF record overhead: ~30 bytes
      const payloadBytes = activePayload ? new TextEncoder().encode(activePayload).length : 0;
      const totalBytes = payloadBytes > 0 ? payloadBytes + 30 : 0;

      // Update validation message UI
      if (msgEl) {
        if (isValid) {
          msgEl.className = "validation-msg success";
          msgEl.textContent = "✓ QR and NFC payload generated";
        } else {
          msgEl.className = "validation-msg error";
          msgEl.textContent = errorMsg;
        }
      }

      // Update capacity indicator
      const pct = Math.min(100, (totalBytes / 180) * 100);
      if (fillEl) {
        fillEl.style.width = pct + "%";
        if (totalBytes <= 150) {
          fillEl.style.backgroundColor = "#22c55e"; // Green
        } else if (totalBytes <= 175) {
          fillEl.style.backgroundColor = "#eab308"; // Yellow
        } else {
          fillEl.style.backgroundColor = "#ef4444"; // Red
        }
      }

      if (textEl) {
        textEl.textContent = `Link capacity: ${totalBytes} bytes / 180 available (NTAG213)`;
      }

      // Enable/Disable CTA buttons
      const isCapacityOk = totalBytes <= 175;
      const canSubmit = isValid && isCapacityOk;

      const btns = [submitBtn, bulkBtn];
      btns.forEach(btn => {
        if (btn) {
          if (canSubmit) {
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
          } else {
            btn.disabled = true;
            btn.style.opacity = "0.4";
            btn.style.pointerEvents = "none";
          }
        }
      });

      // Update live QR Code Preview
      const qrEl = document.getElementById("qr-preview");
      if (qrEl) {
        qrEl.innerHTML = "";
        if (isValid && activePayload) {
          new QRCode(qrEl, {
            text: activePayload,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff"
          });
        } else {
          qrEl.innerHTML = "<div style='color:rgba(255,255,255,0.3); font-size:11px; font-weight:800; text-align:center;'>Awaiting valid input...</div>";
        }
      }
    }

      for(let i=0;i<SECTIONS.length;i++){
        const d=document.createElement('button');

    function scrollToIndex(i){
      i=Math.max(0,Math.min(SECTIONS.length-1,i));

      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});

    window.scrollToSectionByName = function(name){
      const idx = SECTIONS.findIndex(s=>s.name===name);
      if(idx<0) return;
      scrollToIndex(idx);
    };

    function updateBottomNav(){
      if(bnPrev) bnPrev.disabled=currentSecIndex<=0;
      if(bnNext) bnNext.disabled=currentSecIndex>=(SECTIONS.length-1);
      if(bnDots) bnDots.querySelectorAll('.bn-dot').forEach((d,i)=>d.classList.toggle('active',i===currentSecIndex));

      if(bnCtaText && bnCtaTag){
        if(currentSecIndex === CUSTOMIZE_IDX){
          bnCtaText.textContent="Order";
          bnCtaTag.textContent="Now";
        } else {
          bnCtaText.textContent="Customize";
          bnCtaTag.textContent="NFC";
        }
      }
      if (typeof updateValidationAndCapacity === 'function') {
        updateValidationAndCapacity();
      }
      if (typeof handleScrollOptimizations === 'function') {
        handleScrollOptimizations();
      }
    }

    function initBottomNav(){
      buildBottomDots();
      updateBottomNav();
      if(bnPrev) bnPrev.addEventListener('click',()=>scrollToIndex(currentSecIndex-1));
      if(bnNext) bnNext.addEventListener('click',()=>scrollToIndex(currentSecIndex+1));
      if(bnCta) bnCta.addEventListener('click',()=>{
        if(currentSecIndex !== CUSTOMIZE_IDX && CUSTOMIZE_IDX>=0){
          scrollToIndex(CUSTOMIZE_IDX);
        } else {
          window.handleBuyNow();
        }
      });
    }

    // NOTE: threshold/rootMargin tuned so CUSTOMIZE activates on small screens
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('is-active');
          const idx=parseInt(entry.target.getAttribute('data-index'),10);
          currentSecIndex=isNaN(idx)?0:idx;

          secLabel.textContent=`SEC ${currentSecIndex+1}/${SECTIONS.length}`;
          secName.textContent=entry.target.getAttribute('data-name');

          updateBottomNav();

          if(entry.target.getAttribute('data-name')==='CUSTOMIZE'){
            setTimeout(()=>{
              window.initSTLViewer();
              loadForm();
              syncFormToDOM();
            }, 120);
          }
        } else {
          entry.target.classList.remove('is-active');
        }
      });
    },{root:container,threshold:0.45,rootMargin:"0px 0px -60px 0px"});

    function renderSections(){
      container.innerHTML='';
      SECTIONS.forEach((sec,index)=>{
        const w=document.createElement('div');
        w.className='section-wrapper';
        w.setAttribute('data-index',index);
        w.setAttribute('data-name',sec.name);

        w.innerHTML = `
          <article class="card">

              <div class="kicker">${sec.kicker}</div>

            <div class="cardBody">
              ${sec.html()}
              <div style="height:85px;"></div>
            </div>
          </article>
          <div class="hint">
            <span>Scroll for more</span>
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        `;
        container.appendChild(w);
        observer.observe(w);
      });

      setTimeout(()=>{ if(bnDots && bnDots.children.length!==SECTIONS.length) buildBottomDots(); updateBottomNav(); }, 60);
    }

    // ========= ROTATION POPUP (optional helper) =========
    const popup=document.getElementById('rotatePopup');
    const appWrapper=document.getElementById('appWrapper');
    let isForcedLandscape=false, targetRotationAngle=0;

    window.addEventListener('deviceorientation',e=>{
      const g=e.gamma;
      if(g===null||typeof g==='undefined') return;
      if(!isForcedLandscape){
        if(g>45) showRotatePopup(90);
        else if(g<-45) showRotatePopup(-90);
        else hideRotatePopup();
      } else {
        if(Math.abs(g)<25) showRotatePopup(0);
        else hideRotatePopup();
      }
    });
    function showRotatePopup(a){
      targetRotationAngle=a;
      popup.classList.add('is-visible');
      popup.textContent = (a===0) ? "Tap for Portrait" : "Tap for Landscape";
    }
    function hideRotatePopup(){ popup.classList.remove('is-visible'); }
    popup.addEventListener('click',()=>{
      if(targetRotationAngle!==0){
        appWrapper.classList.add('forced-landscape');
        appWrapper.style.transform=`rotate(${targetRotationAngle}deg)`;
        isForcedLandscape=true;
      } else {
        appWrapper.classList.remove('forced-landscape');
        appWrapper.style.transform='none';
        isForcedLandscape=false;
      }
      hideRotatePopup();
    });

    // ========= CONVERSION OPTIMIZATIONS =========
    window.closeExitPopup = function() {
      const overlay = document.getElementById("exit-intent-overlay");
      if (overlay) overlay.classList.remove("active");
    };

    // Detect mouseleave for exit intent popup (desktop)
    document.addEventListener("mouseleave", function(e) {
      if (e.clientY < 50) {
        try {
          if (!localStorage.getItem("exitPopupShown")) {
            const overlay = document.getElementById("exit-intent-overlay");
            if (overlay) overlay.classList.add("active");
            localStorage.setItem("exitPopupShown", "true");
          }
        } catch (err) {}
      }
    });

    // Handle scroll-based visibility for sticky CTA & pricing bar
    function handleScrollOptimizations() {
      const desktopBar = document.getElementById("desktop-pricing-bar");
      const globalCta = document.getElementById("global-sticky-cta");
      if(globalCta) { globalCta.onclick = () => window.handleBuyNow(); globalCta.innerHTML = "<span>🛒 Buy Now</span>"; }
      
      // If we are past the INTRO section (currentSecIndex >= 1)
      if (currentSecIndex >= 1) {
        // Show sticky CTA
        if (globalCta) globalCta.classList.add("visible");
        
        // Show desktop pricing bar (only on screen width > 600px)
        if (desktopBar && window.innerWidth > 600) {
          desktopBar.classList.add("visible");
        } else if (desktopBar) {
          desktopBar.classList.remove("visible");
        }
      } else {
        // Hide both on INTRO
        if (globalCta) globalCta.classList.remove("visible");
        if (desktopBar) desktopBar.classList.remove("visible");
      }
    }

    // Call scroll optimizations when intersection index changes
    window.addEventListener("resize", handleScrollOptimizations);

    // ========= INIT =========
    renderSections();
    initBottomNav();

  })();
  </script>

<script>
/**
 * Aporaksha SSO Client
 * Secure cross-domain session management via hidden iframe bridge.
 */
class AporakshaClient {
  constructor(bridgeUrl = 'https://aporaksha.com/passport/sso-bridge.html') {
    this.bridgeUrl = bridgeUrl;
    this.iframe = null;
    this.ready = false;
    this.pendingResolves = {};
    this.msgId = 0;
    this.init();
  }

  init() {
    if (document.getElementById('aporaksha-sso-bridge')) return;
    
    this.iframe = document.createElement('iframe');
    this.iframe.id = 'aporaksha-sso-bridge';
    this.iframe.src = this.bridgeUrl;
    this.iframe.style.display = 'none';
    document.body.appendChild(this.iframe);

    window.addEventListener('message', (event) => {
      // Must match the origin of the bridgeUrl
      const bridgeOrigin = new URL(this.bridgeUrl).origin;
      if (event.origin !== bridgeOrigin && event.origin !== 'http://localhost:7002') return;

      const data = event.data;
      if (data && data.type === 'SSO_RESPONSE') {
        const id = data.msgId; // If we sent msgId, we would match it. We didn't in the raw bridge, so we match by action/key.
        // Actually, the original sso-bridge.html doesn't echo a msgId, it just echoes action and key.
        const pendingKey = `${data.action}_${data.key}`;
        if (this.pendingResolves[pendingKey]) {
          this.pendingResolves[pendingKey](data.value || data.success);
          delete this.pendingResolves[pendingKey];
        }
      }
    });

    this.iframe.onload = () => {
      this.ready = true;
    };
  }

  async _waitReady() {
    if (this.ready) return;
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (this.ready) {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });
  }

  async getSessionToken() {
    await this._waitReady();
    return new Promise(resolve => {
      const key = 'zayvora_passport_session_v1';
      this.pendingResolves[`get_${key}`] = (val) => resolve(val ? JSON.parse(val) : null);
      this.iframe.contentWindow.postMessage({ action: 'get', key }, '*');
      
      // Fallback timeout
      setTimeout(() => {
        if (this.pendingResolves[`get_${key}`]) {
          resolve(null);
          delete this.pendingResolves[`get_${key}`];
        }
      }, 2000);
    });
  }

  async requireAuth(redirectUrl = window.location.href) {
    const session = await this.getSessionToken();
    if (!session || !session.token) {
      window.location.href = `https://aporaksha.com/passport/index.html?redirect=${encodeURIComponent(redirectUrl)}`;
      return false;
    }
    return session;
  }
}

window.Aporaksha = new AporakshaClient();

</script>

<script>
  window.isSubmittingOrder = false;
  window.submitOrder = async function(role) {
    if (window.isSubmittingOrder) return;
    
    const submitBtn = document.getElementById('submit-btn');
    const submitTextEl = document.getElementById('submit-btn-text');
    const originalText = submitTextEl ? submitTextEl.innerHTML : '';
    
    function resetState() {
      window.isSubmittingOrder = false;
      if (submitBtn) submitBtn.disabled = false;
      if (submitTextEl) submitTextEl.innerHTML = originalText;
    }
    
    try {
      window.isSubmittingOrder = true;
      if (submitBtn) submitBtn.disabled = true;
      if (submitTextEl) submitTextEl.innerHTML = '⏳ Creating Sovereign Identity...';

      // Capture data from the old customization form
      const nameInput = document.getElementById('fVName') ? document.getElementById('fVName').value : 'Sovereign User';
      const phoneInput = document.getElementById('fVPhone') ? document.getElementById('fVPhone').value : `+91${Math.floor(Math.random()*10000000000)}`;
      const email = `user_${Date.now()}@sovereign.local`; // Mock email for now

      // 1. Create Identity on the Sovereign Node
      const identityRes = await fetch('https://daxini.xyz/api/aporaksha/identities/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          phone: phoneInput,
          password: 'secure_password_123',
          first_name: nameInput,
          last_name: ''
        })
      });

      const identityData = await identityRes.json();
      if (!identityData.success) {
        throw new Error(identityData.error || 'Failed to create Sovereign Identity');
      }

      const identityId = identityData.data.identity_id;

      if (submitTextEl) submitTextEl.innerHTML = '⏳ Registering SmartTag...';

      // 2. Register the purchased tag to the new identity
      const tagRes = await fetch('https://daxini.xyz/api/aporaksha/tags', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${identityId}`
        },
        body: JSON.stringify({
          tag_name: 'My New SmartTag',
          tag_type: 'smarttag_lite',
          asset_type: 'other'
        })
      });

      const tagData = await tagRes.json();
      if (!tagData.success) {
        throw new Error(tagData.error || 'Failed to register tag');
      }

      if (submitTextEl) submitTextEl.innerHTML = '✅ Identity & Tag Secured';
      
      // Simulate successful checkout delay
      setTimeout(() => {
        alert(`Success! Sovereign Identity Created:\nID: ${identityId}\nTag ID: ${tagData.data.tag_id}\n\nWelcome to the Zayvora Sovereign Ecosystem!`);
        resetState();
      }, 1000);

    } catch (e) {
      console.error('[Checkout Error]', e);
      if (submitTextEl) submitTextEl.innerHTML = '❌ Error';
      alert('Error: ' + e.message);
      resetState();
    }
  }
</script>
