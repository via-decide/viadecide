<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTag Setup | PrintByDD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .animate-in {
            animation: fadeInRight 0.5s ease-out;
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(96, 165, 250, 0); }
            100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
        }
        .pulse-circle {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-purple-50 p-4 font-sans text-zinc-900">
    
    <!-- Background accents -->
    <div class="fixed top-0 right-0 w-96 h-96 bg-purple-100 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-0 left-0 w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>

    <div class="relative max-w-2xl mx-auto">
        
        <!-- Header -->
        <div class="mb-8 sticky top-0 bg-white/80 backdrop-blur-lg rounded-2xl p-6 border border-white/40 z-50 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-2xl font-bold">SmartTag Setup</h1>
                    <p class="text-sm text-zinc-600 mt-1">PrintByDD NFC Keychain</p>
                </div>
                <div class="text-right">
                    <p class="text-sm font-semibold text-purple-600" id="step-counter">1 / 5</p>
                </div>
            </div>
            
            <!-- Progress bar -->
            <div class="w-full h-2 bg-zinc-200 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-purple-600 to-blue-600 transition-all duration-500 ease-out" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Main Content Box -->
        <div class="bg-white rounded-3xl shadow-xl border border-white overflow-hidden flex flex-col">
            <div class="p-8 md:p-12 min-h-[400px]" id="step-container">
                <!-- Steps will be injected here -->
            </div>

            <!-- Footer Navigation -->
            <div class="bg-gradient-to-t from-zinc-50 to-white border-t border-zinc-100 p-6 md:p-8 mt-auto">
                <div class="flex gap-3">
                    <button id="btn-back" class="hidden h-14 px-6 rounded-xl bg-zinc-100 text-zinc-700 font-semibold hover:bg-zinc-200 transition-all items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-zinc-400">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i> Back

            </div>
        </div>

            <p>Need help? <a href="https://wa.me/919876543210" target="_blank" rel="noopener noreferrer" class="font-semibold text-green-600 hover:underline">WhatsApp Support</a></p>
        </div>

    </div>

                            <div class="flex items-center gap-3 text-zinc-700">

                                <span class="font-medium">Test and done</span>

                        </div>
                    </div>
                `
            },
            {
                subtitle: "Step 1 of 4",
                title: "Download NFC Tools",
                html: `
                    <div class="space-y-6 animate-in">
                        <p class="text-zinc-600">You'll need a free utility app to write your link to the physical tag. Available on iOS & Android.</p>
                        <div class="grid grid-cols-2 gap-4">
                            <a href="https://apps.apple.com/app/nfc-tools/id1252070799" target="_blank" class="block border border-zinc-200 rounded-2xl p-4 hover:border-purple-300 hover:bg-purple-50 transition-all text-center">
                                <div class="bg-zinc-100 rounded-xl p-4 mb-4 flex items-center justify-center h-32">
                                    <div class="w-20 h-20 bg-white rounded-lg border-2 border-dashed border-zinc-300 flex items-center justify-center">
                                        <i data-lucide="qr-code" class="w-10 h-10 text-zinc-400"></i>
                                    </div>
                                </div>
                                <h4 class="font-bold text-sm mb-2 text-left">iOS / App Store</h4>
                                <span class="inline-flex items-center gap-2 text-purple-700 text-xs font-semibold hover:underline">
                                    Open <i data-lucide="external-link" class="w-3 h-3"></i>
                                </span>
                            </a>
                            <a href="https://play.google.com/store/apps/details?id=com.wakdev.nfctools" target="_blank" class="block border border-zinc-200 rounded-2xl p-4 hover:border-purple-300 hover:bg-purple-50 transition-all text-center">
                                <div class="bg-zinc-100 rounded-xl p-4 mb-4 flex items-center justify-center h-32">
                                    <div class="w-20 h-20 bg-white rounded-lg border-2 border-dashed border-zinc-300 flex items-center justify-center">
                                        <i data-lucide="qr-code" class="w-10 h-10 text-zinc-400"></i>
                                    </div>
                                </div>
                                <h4 class="font-bold text-sm mb-2 text-left">Android / Play Store</h4>
                                <span class="inline-flex items-center gap-2 text-purple-700 text-xs font-semibold hover:underline">
                                    Open <i data-lucide="external-link" class="w-3 h-3"></i>
                                </span>
                            </a>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-2">
                            <div class="flex items-start gap-3">
                                <i data-lucide="alert-circle" class="w-5 h-5 text-amber-700 flex-shrink-0 mt-0.5"></i>
                                <div class="text-sm text-amber-900">
                                    <span class="font-semibold block">App: "NFC Tools" by Wakdev</span>
                                    Make sure you download the official one—avoid copycat apps.
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                subtitle: "Step 2 of 4",
                title: "Follow These 4 Steps",
                html: `
                    <div class="space-y-4 animate-in">
                        <p class="text-zinc-600 mb-6">Once the app is installed, open it and follow this sequence:</p>
                        
                        <div class="relative">
                            <div class="flex gap-4">
                                <div class="flex flex-col items-center">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 text-white flex items-center justify-center font-bold text-sm flex-shrink-0">1</div>
                                    <div class="w-1 h-8 bg-purple-200 my-2"></div>
                                </div>
                                <div class="pb-6">
                                    <h4 class="font-bold">Open NFC Tools</h4>
                                    <p class="text-sm text-zinc-600 mt-1">Launch the app and navigate to the Write tab.</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="relative">
                            <div class="flex gap-4">
                                <div class="flex flex-col items-center">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 text-white flex items-center justify-center font-bold text-sm flex-shrink-0">2</div>
                                    <div class="w-1 h-8 bg-purple-200 my-2"></div>
                                </div>
                                <div class="pb-6">

                                </div>
                            </div>
                        </div>

                        <div class="relative">
                            <div class="flex gap-4">
                                <div class="flex flex-col items-center">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 text-white flex items-center justify-center font-bold text-sm flex-shrink-0">3</div>
                                    <div class="w-1 h-8 bg-purple-200 my-2"></div>
                                </div>
                                <div class="pb-6">
                                    <h4 class="font-bold">Select 'URL / URI'</h4>
                                    <p class="text-sm text-zinc-600 mt-1">This allows you to store a web link on the tag.</p>
                                </div>
                            </div>
                        </div>

                        <div class="relative">
                            <div class="flex gap-4">
                                <div class="flex flex-col items-center">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 text-white flex items-center justify-center font-bold text-sm flex-shrink-0">4</div>
                                </div>
                                <div class="pb-6">
                                    <h4 class="font-bold">Paste your link</h4>
                                    <p class="text-sm text-zinc-600 mt-1">Enter or paste the destination URL and tap OK.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                subtitle: "Step 3 of 4",
                title: "Write to Your SmartTag",
                html: `
                    <div class="space-y-6 animate-in">
                        <div class="relative">
                            <div class="mx-auto max-w-xs">
                                <div class="bg-black rounded-3xl p-2 shadow-2xl">
                                    <div class="bg-zinc-900 rounded-2xl p-4 h-80 flex flex-col items-center justify-center relative overflow-hidden">
                                        <div class="absolute top-0 left-0 w-full h-12 bg-blue-600 flex items-center px-4">
                                            <span class="text-white text-xs font-bold">NFC Tools</span>
                                        </div>
                                        
                                        <div class="flex flex-col items-center justify-center gap-4 mt-8">
                                            <div class="animate-pulse">
                                                <i data-lucide="zap" class="w-16 h-16 text-yellow-400"></i>
                                            </div>
                                            <p class="text-white text-center text-sm font-semibold">Approach an NFC tag</p>
                                        </div>

                                        <div class="absolute bottom-16 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-3">
                                            <div class="relative w-12 h-12">
                                                <div class="absolute inset-0 rounded-full pulse-circle"></div>
                                                <i data-lucide="smartphone-nfc" class="w-6 h-6 text-blue-400 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-4 flex items-start gap-3">
                                    <div class="flex flex-col items-center">
                                        <div class="w-1 h-4 bg-purple-400"></div>
                                        <div class="w-3 h-3 rounded-full bg-purple-400"></div>
                                    </div>
                                    <div class="text-sm">
                                        <p class="font-semibold">Tap your SmartTag keychain here</p>
                                        <p class="text-zinc-600">Hold the back-top of your phone against the keychain</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Critical Warning -->
                        <div class="relative">
                            <button onclick="toggleWarning()" class="w-full bg-red-50 border-2 border-red-300 rounded-2xl p-4 hover:bg-red-100 transition-colors text-left focus:outline-none">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <i data-lucide="alert-circle" class="w-6 h-6 text-red-600 flex-shrink-0"></i>
                                        <div>
                                            <h4 class="font-bold text-red-900">Do NOT Lock This Tag</h4>
                                            <p class="text-sm text-red-700 mt-1">This is a critical step—tap to learn why</p>
                                        </div>
                                    </div>
                                    <i data-lucide="chevron-down" id="warning-icon" class="w-5 h-5 text-red-600 transition-transform"></i>
                                </div>
                            </button>
                            <div id="warning-content" class="hidden mt-2 bg-red-50 border border-red-200 rounded-2xl p-4">
                                <p class="text-sm text-red-900 leading-relaxed">
                                    <span class="font-semibold">If you select "Lock tag"</span> in the NFC Tools app, your link becomes <strong>permanent</strong>. You won't be able to change it ever again without completely erasing the tag.
                                </p>
                                <p class="text-sm text-red-900 leading-relaxed mt-3">
                                    <span class="font-semibold">Solution:</span> Skip the "Lock" option. You can always update the link later by following these steps again.
                                </p>
                            </div>
                        </div>

                        <div class="bg-green-50 border border-green-200 rounded-2xl p-4">
                            <p class="text-sm text-green-900">Once you see a <strong>green checkmark</strong>, the tag is written and you're ready to test.</p>
                        </div>
                    </div>
                `
            },
            {
                subtitle: "Step 4 of 4",
                title: "You're All Set!",
                html: `
                    <div class="space-y-6 text-center animate-in">
                        <div class="relative inline-block mt-4">
                            <div class="absolute inset-0 bg-gradient-to-br from-green-200 to-purple-200 rounded-full blur-xl opacity-50 animate-pulse"></div>
                            <div class="relative inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-green-400 to-green-600 rounded-full shadow-lg text-white">
                                <i data-lucide="check-circle" class="w-12 h-12"></i>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold">Configuration Complete</h3>
                            <p class="text-sm text-zinc-600 mt-2">Close NFC Tools and test your SmartTag</p>
                        </div>

                        <div class="bg-zinc-50 rounded-2xl p-6 space-y-3 text-left">
                            <h4 class="font-semibold">Test your tag:</h4>
                            <ol class="space-y-2 text-sm text-zinc-700">
                                <li class="flex gap-3"><span class="font-bold text-purple-600">1.</span><span>Close the NFC Tools app completely</span></li>
                                <li class="flex gap-3"><span class="font-bold text-purple-600">2.</span><span>Turn on your phone screen</span></li>
                                <li class="flex gap-3"><span class="font-bold text-purple-600">3.</span><span>Tap the SmartTag keychain to your phone</span></li>
                                <li class="flex gap-3"><span class="font-bold text-purple-600">4.</span><span>A notification will appear with your link</span></li>
                            </ol>
                        </div>
                        
                        <div class="pt-2 pb-6">
                            <a href="https://wa.me/919876543210" target="_blank" class="inline-flex items-center justify-center w-full gap-2 px-6 py-4 bg-[#25D366] text-white font-bold rounded-xl hover:bg-[#1ebd5a] transition-colors shadow-sm">
                                Message WhatsApp Support
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                `
            }
        ];

        let currentStep = 0;

        const container = document.getElementById('step-container');
        const btnBack = document.getElementById('btn-back');
        const btnNext = document.getElementById('btn-next');
        const stepCounter = document.getElementById('step-counter');
        const progressBar = document.getElementById('progress-bar');
        const footerHelp = document.getElementById('footer-help');

        function renderStep() {
            const step = stepsData[currentStep];
            
            // Render HTML
            container.innerHTML = `
                <h2 class="text-sm font-bold tracking-widest text-purple-600 uppercase mb-3">
                    ${step.subtitle}
                </h2>
                <h1 class="text-4xl font-extrabold text-zinc-900 tracking-tight mb-8 leading-tight">
                    ${step.title}
                </h1>
                <div class="text-lg leading-relaxed text-zinc-700">
                    ${step.html}
                </div>
            `;
            
            // Render lucide icons for newly injected HTML
            lucide.createIcons();

            // Update Header/Progress
            stepCounter.textContent = `${currentStep + 1} / ${stepsData.length}`;
            const pct = (currentStep / (stepsData.length - 1)) * 100;
            progressBar.style.width = `${pct}%`;

            // Update Navigation Buttons
            if (currentStep === 0) {
                btnBack.classList.add('hidden');
                btnBack.classList.remove('flex');
            } else {
                btnBack.classList.remove('hidden');
                btnBack.classList.add('flex');
            }

            if (currentStep === stepsData.length - 1) {
                btnNext.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Complete`;
                btnNext.className = "flex-grow h-14 rounded-xl flex items-center justify-center gap-2 font-bold text-white transition-all bg-zinc-300 cursor-default focus:outline-none";
                btnNext.disabled = true;
                footerHelp.classList.remove('hidden');
            } else {
                btnNext.innerHTML = `Next <i data-lucide="arrow-right" class="w-5 h-5"></i>`;
                btnNext.className = "flex-grow h-14 rounded-xl flex items-center justify-center gap-2 font-bold text-white transition-all bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 active:scale-95";
                btnNext.disabled = false;
                footerHelp.classList.add('hidden');
            }
            
            lucide.createIcons();
        }

        btnNext.addEventListener('click', () => {
            if (currentStep < stepsData.length - 1) {
                currentStep++;
                renderStep();
            }
        });

        btnBack.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        // Global function for the toggle button inside the injected HTML
        window.toggleWarning = function() {
            const content = document.getElementById('warning-content');
            const icon = document.getElementById('warning-icon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        };

        // Init
        renderStep();
    </script>
</body>
</html>
