<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>NFC KDP Books • PrintByDD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root{
      --bg:#050505;
      --card-bg: rgba(18, 18, 20, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text:#fdfdfd;
      --text-muted: rgba(242, 242, 242, 0.65);
      --accent:#ff2a2a;
      --accent2:#22c55e;
      --accent-glow: rgba(255, 42, 42, 0.15);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      --radius: 24px;
      --safeTop: env(safe-area-inset-top, 0px);
      --safeBottom: env(safe-area-inset-bottom, 0px);
      --safeLeft: env(safe-area-inset-left, 0px);
      --safeRight: env(safe-area-inset-right, 0px);
      --maxw: 880px;
      --header-height: 60px;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:100%; height:100dvh; margin:0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow:hidden; overscroll-behavior-y:none;
      -webkit-font-smoothing: antialiased;
    }

    body, .site-header, .top, .bottom-nav, .card, .cardHeader, .kicker, .h1, .cardBody, .lead, .qt, .ul, .steps, .sg, .pill {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea { user-select:text; -webkit-user-select:text; }
    a{ color:inherit; text-decoration:none; }
    button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; -webkit-tap-highlight-color: transparent; }

    /* ===== Site Header ===== */
    .site-header{
      position:absolute; top:0; left:0; right:0;
      height: var(--header-height);
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
      z-index:1000;
    }
    .site-header .logo{ color:var(--accent); font-size:18px; font-weight:900; letter-spacing:-0.02em; }
    .nav-container { display:flex; align-items:center; gap:18px; }
    .site-header nav{ display:flex; gap:18px; align-items:center; }
    .site-header nav a{ color:var(--text-muted); font-weight:800; font-size:13px; transition:color .2s; text-transform:uppercase; letter-spacing:.05em; }
    .site-header nav a:hover, .site-header nav a.active{ color:var(--text); }

    body.invert-mode .site-header{ filter:invert(1) hue-rotate(180deg); }
    body.invert-mode #appWrapper, body.invert-mode #translationToast, body.invert-mode #rotatePopup{ filter:invert(1) hue-rotate(180deg); }
    body.invert-mode img, body.invert-mode video, body.invert-mode canvas{ filter:invert(1) hue-rotate(180deg); }

    #appWrapper{ position:relative; width:100vw; height:100dvh; transform-origin:center center; transition:transform 0.4s cubic-bezier(0.25,1,0.5,1); overflow:hidden; }
    #appWrapper.forced-landscape{ width:100dvh; height:100vw; position:absolute; top:50%; left:50%; margin-top:-50vw; margin-left:-50dvh; }

    .bg-glow{
      position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,42,42,0.16), transparent 60%),
        radial-gradient(circle at 85% 100%, rgba(255,255,255,0.03), transparent 60%);
      z-index:0;
    }

    .top{
      position:absolute; top:var(--header-height); left:0; right:0;
      padding:calc(16px + var(--safeTop)) calc(16px + var(--safeRight)) 16px calc(16px + var(--safeLeft));
      z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(5,5,5,0.95) 0%,rgba(5,5,5,0) 100%);
    }
    .top > *{ pointer-events:auto; }
    .top-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

    .back, .pill, .btn-icon{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 16px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(15,15,15,0.65);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:all 0.2s ease;
    }
    .btn-icon{ padding:10px; font-weight:950; color:var(--accent); width:38px; height:38px; }
    .btn-icon:active, .back:active{ transform:scale(0.96); }
    .back{ color:rgba(255,255,255,0.92); font-weight:900; font-size:14px; cursor:pointer;}
    .pill{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; }
    .pill b{ color:#fff; letter-spacing:0.1em; font-weight:950; }

    .scroll-container{
      position:absolute; top:var(--header-height); bottom:0; left:0; right:0;
      overflow-y:auto; overflow-x:hidden;
      scroll-snap-type:y mandatory; scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
      z-index:10;
    }
    .scroll-container::-webkit-scrollbar{ display:none; }

    .section-wrapper{
      height:100%; width:100%;
      scroll-snap-align:start; scroll-snap-stop:always;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:calc(90px + var(--safeTop)) calc(16px + var(--safeRight)) calc(120px + var(--safeBottom)) calc(16px + var(--safeLeft));
      position:relative;
    }

    .card{
      width:100%; max-width:var(--maxw);
      flex:1; min-height:0;
      border-radius:var(--radius);
      border:1px solid var(--card-border);
      background:var(--card-bg);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow);
      display:flex; flex-direction:column;
      overflow:hidden;
      opacity:0.30;
      transform:scale(0.92) translateY(30px);
      transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .section-wrapper.is-active .card{ opacity:1; transform:scale(1) translateY(0); }

    .cardHeader{
      padding:24px 24px 20px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      background:rgba(0,0,0,0.3);
      flex-shrink:0;
    }
    .kicker{ font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; font-weight:950; }
    .h1{ margin:0; font-size:clamp(22px,5vw,28px); line-height:1.3; letter-spacing:-0.01em; font-weight:950; }
    .cardBody{ padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }

    .big{ font-size:clamp(28px,6vw,46px); line-height:1.12; font-weight:950; letter-spacing:-0.03em; margin:0 0 18px; }
    .big .r, .r{ background:linear-gradient(135deg,#ff6b6b,#ff2a2a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .lead{ font-size:17px; line-height:1.65; color:rgba(255,255,255,0.85); margin:0 0 16px; }
    .qt{ margin:18px 0 10px; padding:14px 18px; border-left:3px solid var(--accent); background:linear-gradient(90deg,var(--accent-glow),transparent); border-radius:0 12px 12px 0; color:rgba(255,255,255,0.95); line-height:1.65; font-size:15px; font-style:italic; }

    .ul{ margin:14px 0; padding:0; list-style:none; color:rgba(255,255,255,0.78); font-size:15px; line-height:1.65; }
    .ul li{ position:relative; padding-left:22px; margin:10px 0; }
    .ul li::before{ content:'→'; position:absolute; left:0; color:var(--accent); font-weight:950; }

    .steps{ display:flex; flex-direction:column; gap:16px; margin:16px 0; }
    .step{ display:flex; gap:14px; align-items:flex-start; }
    .step-num{ flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font-weight:950; font-size:14px; display:flex; align-items:center; justify-content:center; }
    .step-title{ font-weight:950; font-size:15px; color:#fff; margin-bottom:4px; }
    .step-desc{ font-size:14px; color:rgba(255,255,255,0.72); line-height:1.6; }

    .sg{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .sn{ background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px 10px; text-align:center; }
    .sv{ font-size:22px; font-weight:950; color:#fff; line-height:1.1; letter-spacing:-0.02em; }
    .slbl{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.45); margin-top:6px; }

    .cp{
      display:flex; align-items:center; justify-content:center;
      border:none; border-radius:16px;
      background:linear-gradient(135deg,#ff4444,#b80000);
      cursor:pointer; overflow:hidden; position:relative;
      box-shadow:0 8px 28px rgba(255,42,42,0.38);
      transition:transform .2s,filter .2s;
      min-height:54px; width:100%; padding:0;
    }
    .cp.alt{
      background:linear-gradient(135deg,#111,#000);
      box-shadow:0 8px 28px rgba(0,0,0,0.55);
    }
    .cp.green{
      background:linear-gradient(135deg,#1dd15f,#0a7a2f);
      box-shadow:0 8px 28px rgba(34,197,94,0.28);
    }
    .cp:active{ transform:scale(0.97); }
    .cpulse{ position:absolute; inset:0; background:rgba(255,255,255,0.15); animation:cpa 2s infinite; }
    @keyframes cpa{ 0%,100%{opacity:0} 50%{opacity:1} }
    .ci{ position:relative; z-index:1; display:flex; align-items:center; gap:8px; color:#fff; font-weight:950; font-size:15px; padding:0 24px; }
    .ca{ background:rgba(255,255,255,0.2); border-radius:8px; padding:4px 10px; font-size:14px; }

    /* STL viewer */
    .stl-viewer-wrap{
      position:relative; width:100%;
      height: 280px; min-height: 280px; max-height: 280px;
      border-radius:16px; overflow:hidden;
      border:1px solid rgba(255,255,255,0.1);
      background:#0a0a0a; margin-bottom:14px;
      touch-action:none;
    }
    .stl-viewer-wrap canvas{ display:block; width:100%!important; height:100%!important; object-fit:contain; }
    .stl-loading{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:12px; color:rgba(255,255,255,0.45);
      letter-spacing:0.12em; text-transform:uppercase;
      pointer-events:none; background:#0a0a0a;
      transition:opacity 0.4s; padding:16px; text-align:center; z-index:5;
    }
    .stl-loading.hidden{ opacity:0; pointer-events:none; }
    .stl-hint{
      position:absolute; bottom:10px; left:50%;
      transform:translateX(-50%);
      font-size:10px; color:rgba(255,255,255,0.25);
      letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap;
      pointer-events:none; z-index:5;
    }

    /* Color panel */
    .stl-color-panel{ margin-top:8px; padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.22); }
    .stl-color-title{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.45); font-weight:950; margin:0 0 8px; }
    .stl-color-row{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; margin:8px 0 0; }
    .stl-color-btn{
      display:flex; flex-direction:row; align-items:center; gap:10px;
      padding:10px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.35);
      transition:all 0.2s;
      font-size:12px; font-weight:900;
      color:rgba(255,255,255,0.72);
      min-width:118px;
    }
    .stl-color-btn:active{ transform:scale(0.97); }
    .stl-color-btn.active{ border-color:var(--accent); background:var(--accent-glow); color:#fff; }
    .stl-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); flex-shrink:0; }
    @media (max-width:420px){ .stl-color-btn{ min-width:46%; } }

    /* Form */
    .form-card{
      margin-top:12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(0,0,0,0.25);
      padding:14px;
    }
    .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:560px){ .fgrid{ grid-template-columns:1fr; } }
    .flabel{
      font-size:10px; font-weight:950; letter-spacing:0.12em; text-transform:uppercase;
      color:rgba(255,255,255,0.45);
      margin:0 0 6px;
    }
    .finp{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(8,8,10,0.65);
      color:#fff;
      outline:none;
      font-size:14px;
      transition:border-color .15s, box-shadow .15s;
    }
    .finp:focus{
      border-color: rgba(255,42,42,0.65);
      box-shadow:0 0 0 3px rgba(255,42,42,0.12);
    }
    .help{
      margin-top:10px;
      font-size:12px;
      color:rgba(255,255,255,0.55);
      line-height:1.6;
    }
    .preview-chip{
      margin-top:12px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      font-size:12px;
      color:rgba(255,255,255,0.85);
      font-weight:900;
      max-width:100%;
    }
    .chip b{ color:#fff; }
    .chip small{ color:rgba(255,255,255,0.60); font-weight:900; }
    .chip .dot{ width:8px; height:8px; border-radius:999px; background:var(--accent2); box-shadow:0 0 0 3px rgba(34,197,94,0.12); }

    /* Bottom nav */
    .bottom-nav{
      position:fixed;
      left:max(10px,var(--safeLeft)); right:max(10px,var(--safeRight));
      bottom:calc(10px + var(--safeBottom));
      height:64px;
      display:flex; align-items:center; gap:10px;
      padding:10px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(10,10,12,0.78);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 60px rgba(0,0,0,0.55);
      z-index:1200;
    }
    .bn-btn{
      width:44px; height:44px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.92);
      font-weight:950;
      display:flex; align-items:center; justify-content:center;
      transition:transform .2s,opacity .2s;
      flex-shrink:0;
    }
    .bn-btn:active{ transform:scale(0.96); }
    .bn-btn:disabled{ opacity:0.35; pointer-events:none; }
    .bn-dots{ flex:1; display:flex; gap:8px; align-items:center; justify-content:center; min-width:0; overflow:hidden; }
    .bn-dot{
      width:8px; height:8px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.10);
      transition:background .2s,border-color .2s,width .2s;
      flex-shrink:0;
    }
    .bn-dot.active{ width:22px; background:var(--accent); border-color:rgba(255,42,42,0.7); }
    .bn-cta{
      height:44px; padding:0 16px;
      border-radius:14px;
      border:none;
      background:linear-gradient(135deg,#ff4444,#b80000);
      color:#fff; font-weight:950;
      letter-spacing:-0.01em;
      display:flex; align-items:center; gap:10px;
      box-shadow:0 10px 26px rgba(255,42,42,0.35);
      transition:transform .2s,filter .2s;
      white-space:nowrap;
      flex-shrink:0;
    }
    .bn-cta:active{ transform:scale(0.97); filter:brightness(1.06); }
    .bn-cta .bn-tag{ font-size:12px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.18); }

    .hint{
      position:absolute; bottom:calc(16px + var(--safeBottom)); left:50%;
      transform:translateX(-50%);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      color:rgba(255,255,255,0.4);
      font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
      pointer-events:none;
      animation:pulse 2s infinite;
      z-index:100;
    }
    .hint svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.5; }
    @keyframes pulse{ 0%,100%{transform:translateX(-50%) translateY(0);opacity:0.6} 50%{transform:translateX(-50%) translateY(5px);opacity:1} }
    .section-wrapper:last-child .hint{ display:none; }

    @media (max-width: 600px) {
      .site-header nav { display: none; }
      .nav-container { justify-content: flex-end; width: 100%; }
    }
  </style>
</head>

<body>
  <div id="appWrapper">
    <div class="bg-glow"></div>

    <header class="site-header">
      <a href="./index.html" class="logo" id="logoLink">PrintByDD</a>
      <div class="nav-container">
        <nav>
          <a href="./index.html" id="navHome">Home</a>
          <a href="./products.html" id="navProds" class="active">Products</a>
          <a href="./gift-psychology.html" id="navBlog">Blog</a>
        </nav>
      </div>
    </header>

    <div class="top">
      <a class="back" href="./products.html" id="backBtn">← Back</a>
      <div class="top-actions">
        <button id="btnTheme" class="btn-icon" aria-label="Toggle theme" title="Toggle theme">☾</button>
        <div class="pill"><b id="secLabel">SEC 1/4</b> • <span id="secName">INTRO</span></div>
      </div>
    </div>

    <main class="scroll-container" id="scrollContainer"></main>

    <div class="bottom-nav" id="bottomNav">
      <button class="bn-btn" id="bnPrev" type="button" aria-label="Previous">←</button>
      <div class="bn-dots" id="bnDots"></div>
      <button class="bn-btn" id="bnNext" type="button" aria-label="Next">→</button>
      <button class="bn-cta" id="bnCta" type="button">
        <span id="bnCtaText">Customize</span>
        <span class="bn-tag" id="bnCtaTag">NFC</span>
      </button>
    </div>
  </div>

  <div id="rotatePopup" class="rotate-popup"></div>

  <script>
  (function(){
    "use strict";

    const WA_NUMBER = "916351537770";
    const STL_URL = "kdp-books.stl";

    // ── Color Swatches ──
    const COLORS = {
      crimson: 0xa81c1c,
      obsidian: 0x1a1a1a,
      sand: 0xd4b88a
    };
    let currentColorKey = "crimson";

    const PERSIST_KEY = "PBD_KDP_BOOKS_COLOR_V1";
    (function loadPersistedColor(){
      try{
        const saved = localStorage.getItem(PERSIST_KEY);
        if(saved && COLORS[saved]) currentColorKey = saved;
      }catch (e) {}
    })();
    function persistColor(){
      try{ localStorage.setItem(PERSIST_KEY, currentColorKey); }catch (e) {}
    }

    // ── Form State ──
    const FORM_KEY = "PBD_KDP_BOOKS_FORM_V1";
    const formState = {
      title: "",
      author: "",
      link: "",
      note: ""
    };

    function loadForm(){
      try{
        const s = JSON.parse(localStorage.getItem(FORM_KEY) || "{}");
        if(typeof s.title==="string") formState.title = s.title.slice(0,60);
        if(typeof s.author==="string") formState.author = s.author.slice(0,40);
        if(typeof s.link==="string") formState.link = s.link.slice(0,160);
        if(typeof s.note==="string") formState.note = s.note.slice(0,80);
      }catch (e) {}
    }
    function saveForm(){
      try{ localStorage.setItem(FORM_KEY, JSON.stringify(formState)); }catch (e) {}
    }

    function setFormFromDOM(){
      const t = document.getElementById("fTitle");
      const a = document.getElementById("fAuthor");
      const l = document.getElementById("fLink");
      const n = document.getElementById("fNote");
      if(t) formState.title = (t.value||"").slice(0,60);
      if(a) formState.author = (a.value||"").slice(0,40);
      if(l) formState.link = (l.value||"").slice(0,160);
      if(n) formState.note = (n.value||"").slice(0,80);
      saveForm();
      syncPreviewChips();
    }

    // Bind event handlers
    function syncFormToDOM(){
      const t = document.getElementById("fTitle");
      const a = document.getElementById("fAuthor");
      const l = document.getElementById("fLink");
      const n = document.getElementById("fNote");
      if(t) t.value = formState.title;
      if(a) a.value = formState.author;
      if(l) l.value = formState.link;
      if(n) n.value = formState.note;
      syncPreviewChips();
    }

    function syncPreviewChips(){
      const c1 = document.getElementById("chipTitle");
      const c2 = document.getElementById("chipAuthor");
      const c3 = document.getElementById("chipLink");
      const c4 = document.getElementById("chipNote");
      if(c1) c1.textContent = formState.title ? formState.title : "Book Title";
      if(c2) c2.textContent = formState.author ? formState.author : "Author Name";
      if(c3) c3.textContent = formState.link ? formState.link : "NFC Redirect URL";
      if(c4) c4.textContent = formState.note ? formState.note : "Custom Note";
    }

    // ── Three.js Setup ──
    let renderer=null, scene=null, camera=null, group=null, mesh=null, paperMesh=null;
    let pointerDown=false, lastX=0, lastY=0, inited=false, autoRotate=true;

    window.initSTLViewer = async function(){
      if(inited) return;
      const wrap    = document.getElementById('stl-viewer-wrap');
      const canvas  = document.getElementById('stl-canvas');
      const loading = document.getElementById('stl-loading');
      if(!wrap || !canvas) return;
      inited = true;

      const W = wrap.clientWidth || 320;
      const H = 280;

      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(W, H, false);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
      camera.position.set(0, 0, 4.2);

      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      const d1 = new THREE.DirectionalLight(0xffffff, 0.95); d1.position.set(2.5, 3, 2); scene.add(d1);
      const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(-2, -1, -2); scene.add(d2);

      group = new THREE.Group();
      scene.add(group);

      try {
        const coverGeo = new THREE.BoxGeometry(2.1, 3.1, 0.35);
        const coverMat = new THREE.MeshStandardMaterial({ color: COLORS[currentColorKey], roughness: 0.58, metalness: 0.08 });
        mesh = new THREE.Mesh(coverGeo, coverMat);
        group.add(mesh);

        const paperGeo = new THREE.BoxGeometry(2.0, 3.0, 0.3);
        const paperMat = new THREE.MeshStandardMaterial({ color: 0xf5f3eb, roughness: 0.95, metalness: 0.0 });
        paperMesh = new THREE.Mesh(paperGeo, paperMat);
        paperMesh.position.set(0.04, 0, 0); // expose book spine
        group.add(paperMesh);

        group.rotation.x = -0.35;
        group.rotation.y =  0.90;

        if(loading) loading.classList.add('hidden');

        // Interactions
        function onDown(e){
          pointerDown=true; autoRotate=false;
          const t = e.touches ? e.touches[0] : e;
          lastX=t.clientX; lastY=t.clientY;
        }
        function onMove(e){
          if(!pointerDown || !group) return;
          const t = e.touches ? e.touches[0] : e;
          group.rotation.y += (t.clientX-lastX) * 0.01;
          group.rotation.x += (t.clientY-lastY) * 0.01;
          lastX=t.clientX; lastY=t.clientY;
        }
        function onUp(){ pointerDown=false; }

        wrap.addEventListener('pointerdown', onDown);
        wrap.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);

        wrap.addEventListener('touchstart', onDown, {passive:true});
        wrap.addEventListener('touchmove',  onMove, {passive:true});
        wrap.addEventListener('touchend',   onUp,   {passive:true});

        window.addEventListener('resize', ()=>{
          if(!wrap || !renderer || !camera) return;
          const w = wrap.clientWidth || 320, h = 280;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        });

        (function animate(){
          requestAnimationFrame(animate);
          if(autoRotate && group) group.rotation.y += 0.004;
          if(renderer && scene && camera) renderer.render(scene, camera);
        })();

        applyColor();
      } catch(err) {
        if(loading) loading.textContent = "3D preview error.";
        console.error("Three.js error:", err);
      }
    };

    function applyColor(){
      if(mesh) mesh.material.color.setHex(COLORS[currentColorKey]);
      persistColor();
      syncColorUI();
    }

    function syncColorUI(){
      document.querySelectorAll('[data-color-btn]').forEach(b => b.classList.toggle('active', b.getAttribute('data-color-btn')===currentColorKey));
      const lbl=document.getElementById("colorLbl");
      if(lbl) lbl.textContent=currentColorKey.toUpperCase();
    }

    window.setTagColor = function(key, btn){
      if(!COLORS[key]) return;
      currentColorKey = key;
      applyColor();
      if(btn){
        document.querySelectorAll('[data-color-btn]').forEach(b=>b.classList.remove('active'));

          </div>

      },
      {
        name: "BENEFITS", kicker: "Interaction Model",

            <li><b>Instant Companion Audio</b>: Tap to trigger the accompanying audiobook stream.</li>

      },
      {

      },
      {
        name: "ORDER", kicker: "Ready to Dispatch",

          <button class="cp" onclick="window.submitOrder()">
            <span class="cpulse"></span><div class="ci">🛒 Checkout via Razorpay <div class="ca">→</div></div>
          </button>
          <p style="margin-top:14px;font-size:11px;color:rgba(255,255,255,0.3);line-height:1.6;text-align:center;">
            Includes standard shipping pan-India · COD options available.
          </p>
        `
      }
    ];

    // ── Carousel Controls ──
    const container = document.getElementById('scrollContainer');
    const secLabel = document.getElementById('secLabel');
    const secName = document.getElementById('secName');
    const bnPrev = document.getElementById('bnPrev');
    const bnNext = document.getElementById('bnNext');
    const bnDots = document.getElementById('bnDots');
    const bnCta = document.getElementById('bnCta');
    const bnCtaText = document.getElementById('bnCtaText');
    const bnCtaTag = document.getElementById('bnCtaTag');

    let currentSecIndex = 0;
    const CUSTOMIZE_IDX = 2;

    function scrollToIndex(idx){
      if(idx<0 || idx>=SECTIONS.length) return;
      const el = container.children[idx];
      if(el) el.scrollIntoView({ behavior:'smooth' });
    }

    function buildBottomDots(){
      if(!bnDots) return;
      bnDots.innerHTML='';
      SECTIONS.forEach((_,i)=>{
        const dot = document.createElement('button');
        dot.className = `bn-dot ${i===currentSecIndex?'active':''}`;
        dot.addEventListener('click',()=>scrollToIndex(i));
        bnDots.appendChild(dot);
      });
    }

    function updateBottomNav(){
      if(bnPrev) bnPrev.disabled = currentSecIndex===0;
      if(bnNext) bnNext.disabled = currentSecIndex===SECTIONS.length-1;
      if(bnDots) bnDots.querySelectorAll('.bn-dot').forEach((d,i)=>d.classList.toggle('active',i===currentSecIndex));
      if(bnCta && bnCtaText && bnCtaTag){
        if(currentSecIndex === CUSTOMIZE_IDX){
          bnCtaText.textContent="Order";
          bnCtaTag.textContent="Now";
        } else {
          bnCtaText.textContent="Customize";
          bnCtaTag.textContent="NFC";
        }
      }
    }

    function initBottomNav(){
      buildBottomDots();
      updateBottomNav();
      if(bnPrev) bnPrev.addEventListener('click',()=>scrollToIndex(currentSecIndex-1));
      if(bnNext) bnNext.addEventListener('click',()=>scrollToIndex(currentSecIndex+1));
      if(bnCta) bnCta.addEventListener('click',()=>{
        if(currentSecIndex !== CUSTOMIZE_IDX && CUSTOMIZE_IDX>=0){
          scrollToIndex(CUSTOMIZE_IDX);
        } else {
          orderOnWhatsApp(false);
        }
      });
    }

    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('is-active');
          const idx=parseInt(entry.target.getAttribute('data-index'),10);
          currentSecIndex=isNaN(idx)?0:idx;
          secLabel.textContent=`SEC ${currentSecIndex+1}/${SECTIONS.length}`;
          secName.textContent=entry.target.getAttribute('data-name');
          updateBottomNav();

          if(entry.target.getAttribute('data-name')==='CUSTOMIZE'){
            setTimeout(()=>{
              window.initSTLViewer();
              syncColorUI();
              loadForm();
              syncFormToDOM();
              const fids = ["fTitle","fAuthor","fLink","fNote"];
              fids.forEach(id=>{
                const el = document.getElementById(id);
                if(el && !el.dataset.bound){
                  el.dataset.bound = "1";
                  el.addEventListener("input", setFormFromDOM);
                  el.addEventListener("change", setFormFromDOM);
                }
              });
            }, 120);
          }
        } else {
          entry.target.classList.remove('is-active');
        }
      });
    },{root:container,threshold:0.45,rootMargin:"0px 0px -60px 0px"});

    function renderSections(){
      container.innerHTML='';
      SECTIONS.forEach((sec,index)=>{
        const w=document.createElement('div');
        w.className='section-wrapper';
        w.setAttribute('data-index',index);
        w.setAttribute('data-name',sec.name);
        w.innerHTML = `
          <article class="card">
            <header class="cardHeader">
              <div class="kicker">${sec.kicker}</div>
              <h1 class="h1">${sec.title}</h1>

            <div class="cardBody">
              ${sec.html()}
              <div style="height:85px;"></div>
            </div>
          </article>
          <div class="hint">
            <span>Scroll for more</span>
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        `;
        container.appendChild(w);
        observer.observe(w);
      });
    }

    // ========= Theme Toggle =========
    const btnTheme = document.getElementById("btnTheme");
    if(btnTheme){
      btnTheme.onclick = () => {
        document.body.classList.toggle("invert-mode");
      };
    }

    // ========= INIT =========
    renderSections();
    initBottomNav();
    syncColorUI();
  })();
  </script>

<script>
/**
 * Aporaksha SSO Client
 * Secure cross-domain session management via hidden iframe bridge.
 */
class AporakshaClient {
  constructor(bridgeUrl = 'https://aporaksha.com/passport/sso-bridge.html') {
    this.bridgeUrl = bridgeUrl;
    this.iframe = null;
    this.ready = false;
    this.pendingResolves = {};
    this.msgId = 0;
    this.init();
  }

  init() {
    if (document.getElementById('aporaksha-sso-bridge')) return;
    
    this.iframe = document.createElement('iframe');
    this.iframe.id = 'aporaksha-sso-bridge';
    this.iframe.src = this.bridgeUrl;
    this.iframe.style.display = 'none';
    document.body.appendChild(this.iframe);

    window.addEventListener('message', (event) => {
      // Must match the origin of the bridgeUrl
      const bridgeOrigin = new URL(this.bridgeUrl).origin;
      if (event.origin !== bridgeOrigin && event.origin !== 'http://localhost:7002') return;

      const data = event.data;
      if (data && data.type === 'SSO_RESPONSE') {
        const id = data.msgId; // If we sent msgId, we would match it. We didn't in the raw bridge, so we match by action/key.
        // Actually, the original sso-bridge.html doesn't echo a msgId, it just echoes action and key.
        const pendingKey = `${data.action}_${data.key}`;
        if (this.pendingResolves[pendingKey]) {
          this.pendingResolves[pendingKey](data.value || data.success);
          delete this.pendingResolves[pendingKey];
        }
      }
    });

    this.iframe.onload = () => {
      this.ready = true;
    };
  }

  async _waitReady() {
    if (this.ready) return;
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (this.ready) {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });
  }

  async getSessionToken() {
    await this._waitReady();
    return new Promise(resolve => {
      const key = 'zayvora_passport_session_v1';
      this.pendingResolves[`get_${key}`] = (val) => resolve(val ? JSON.parse(val) : null);
      this.iframe.contentWindow.postMessage({ action: 'get', key }, '*');
      
      // Fallback timeout
      setTimeout(() => {
        if (this.pendingResolves[`get_${key}`]) {
          resolve(null);
          delete this.pendingResolves[`get_${key}`];
        }
      }, 2000);
    });
  }

  async requireAuth(redirectUrl = window.location.href) {
    const session = await this.getSessionToken();
    if (!session || !session.token) {
      window.location.href = `https://aporaksha.com/passport/index.html?redirect=${encodeURIComponent(redirectUrl)}`;
      return false;
    }
    return session;
  }
}

window.Aporaksha = new AporakshaClient();

</script>

<script>
  window.submitOrder = async function(role) {
    const email = ((typeof authState !== 'undefined' && authState.email) || localStorage.getItem('PBD_USER') || '').trim();
    
    try {
      // 1. Require Aporaksha Auth
      const session = await window.Aporaksha.requireAuth(window.location.href);
      if (!session || !session.token) {
        return; // Redirected
      }

      // 2. Fetch Razorpay Order from Aporaksha
      const res = await fetch('https://aporaksha.com/api/payments/create-order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.token}`
        },
        body: JSON.stringify({
          product_id: 'test_product',
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          locale: navigator.language
        })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Failed to create order');
      }

      // 3. Open Razorpay Checkout Modal
      const options = {
        key: data.key_id,
        amount: data.amount,
        currency: data.currency,
        name: data.product_name,
        description: "PrintByDD Purchase",
        order_id: data.type === 'order' ? data.order_id : undefined,
        subscription_id: data.type === 'subscription' ? data.subscription_id : undefined,
        handler: function (response) {
          alert(`Payment successful! ID: ${response.razorpay_payment_id}`);
        },
        theme: {
          color: "#e51d2f"
        }
      };
      const rzp1 = new Razorpay(options);
      rzp1.open();
      
    } catch (err) {
      console.error(err);
      alert(err.message);
    }
  }
</script>
