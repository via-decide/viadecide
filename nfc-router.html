<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIA Intent Router</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, sans-serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 103, 31, 0.3);
      border-top-color: #ff671f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .text {
      font-size: 14px;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="text" id="router-status">Resolving Intent...</div>
  </div>

  <script type="module">
    import { viaAuth } from '../core/via-auth-sdk.js';
    
    // Map of known apps and their relative entry paths from the root
    const APP_ROUTES = {
      'alchemist': '../alchemist_app/index.html',
      'logic': '../ViaLogic/index.html',
      'root': './index.html',
      'logichub': '../LogicHub/index.html',
      'passport': '../aporaksha/passport/index.html'
    };

    function updateStatus(text, color = '#888') {
      const statusEl = document.getElementById('router-status');
      if (statusEl) {
        statusEl.textContent = text;
        statusEl.style.color = color;
      }
    }

    async function handlePackageInstallation(pkgUrl) {
      updateStatus("Loading unpacker engine...");
      
      // 1. Load JSZip via CDN if not present
      if (typeof JSZip === 'undefined') {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load JSZip dependency"));
          document.head.appendChild(script);
        });
      }

      updateStatus("Downloading knowledge package...");
      const response = await fetch(pkgUrl);
      if (!response.ok) {
        throw new Error(`Failed to download package from server (HTTP ${response.status})`);
      }
      
      updateStatus("Unpacking cartridge...");
      const arrayBuffer = await response.arrayBuffer();
      const zip = await JSZip.loadAsync(arrayBuffer);
      
      const manifestFile = zip.file("manifest.json");
      if (!manifestFile) {
        throw new Error("Invalid cartridge: manifest.json is missing");
      }
      
      const manifest = JSON.parse(await manifestFile.async("string"));
      updateStatus(`Installing: ${manifest.package_id || 'unknown'}...`);

      // Extract zip entries
      const files = {};
      for (const [relPath, fileEntry] of Object.entries(zip.files)) {
        if (fileEntry.dir) continue;
        const isBinary = /\.(png|jpg|jpeg|gif|zip|epub|pdf|woff|woff2|eot|ttf)$/i.test(relPath);
        if (isBinary) {
          files[relPath] = {
            type: 'base64',
            data: await fileEntry.async('base64')
          };
        } else {
          files[relPath] = {
            type: 'text',
            data: await fileEntry.async('string')
          };
        }
      }

      // Write to IndexedDB
      updateStatus("Writing to local node ledger...");
      await new Promise((resolve, reject) => {
        const dbRequest = indexedDB.open("ZayvoraPackages", 1);
        dbRequest.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains("packages")) {
            db.createObjectStore("packages", { keyPath: "package_id" });
          }
        };
        dbRequest.onsuccess = (event) => {
          const db = event.target.result;
          const tx = db.transaction("packages", "readwrite");
          const store = tx.objectStore("packages");
          store.put({
            package_id: manifest.package_id,
            manifest: manifest,
            files: files,
            installed_at: new Date().toISOString()
          });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        };
        dbRequest.onerror = () => reject(dbRequest.error);
      });

      updateStatus("Cartridge installed successfully!", "#00ff88");
      return manifest;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetApp = urlParams.get('app') || 'root';
      const intent = urlParams.get('intent');
      const action = urlParams.get('action');
      const pkgUrl = urlParams.get('pkg_url');
      
      // Wait for silent SSO sync to complete first to prevent redirect race condition
      await viaAuth.syncSession();
      
      const uid = viaAuth.getEcosystemUid();
      
      if (!uid) {
        // If not authenticated, force them to Passport to login
        console.log('[NFC Router] No active identity. Redirecting to Passport...');
        viaAuth.redirectToPassportLogin();
        return;
      }
      
      console.log(`[NFC Router] Identity confirmed: ${uid}. Resolving intent: ${intent || 'none'}...`);
      
      try {
        if (intent === 'install_pkg' && pkgUrl) {
          const manifest = await handlePackageInstallation(pkgUrl);
          // Auto route to studyos or targeted entrypoint if defined
          console.log(`[NFC Router] Package ${manifest.package_id} successfully installed.`);
        }
      } catch (err) {
        console.error('[NFC Router] Package installation failed:', err);
        updateStatus(`Installation Error: ${err.message}`, '#ff4444');
        // Stop execution to let user inspect error
        return;
      }
      
      // Resolve path
      const path = APP_ROUTES[targetApp] || APP_ROUTES['root'];
      
      // Reconstruct intent parameters to pass to the target app
      const forwardParams = new URLSearchParams();
      if (intent) forwardParams.set('intent', intent);
      if (action) forwardParams.set('action', action);
      
      const queryString = forwardParams.toString() ? `?${forwardParams.toString()}` : '';
      
      // Small delay for smooth visual transition
      setTimeout(() => {
        window.location.href = `${path}${queryString}`;
      }, 800);
    });
  </script>
</body>
</html>
